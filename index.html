<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluento - English Speaking Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = "https://beqmmczwetvbxieentrz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KZ2ONlqKUuDe6bYxNggowQ_kc-3kBDL";
    const RAZORPAY_KEY_ID = "rzp_test_TQ1hiiz3p8aR70";
    const WORKER_URL = "https://morning-bonus-5828.imsamimmandal601.workers.dev";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MicIcon = ({ size = 28, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
    );

    const GoogleIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
    );

    function App() {
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authError, setAuthError] = useState("");
      const [authLoading, setAuthLoading] = useState(false);

      const [mainChoice, setMainChoice] = useState(null);
      const [level, setLevel] = useState(null);
      const [mode, setMode] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [showLevelModal, setShowLevelModal] = useState(false);
      const [showModeModal, setShowModeModal] = useState(false);

      // Streak
      const [currentStreak, setCurrentStreak] = useState(0);
      const [longestStreak, setLongestStreak] = useState(0);

      // Voice
      const [isListening, setIsListening] = useState(false);
      const [micStatus, setMicStatus] = useState("");
      const recognitionRef = useRef(null);
      const finalTextRef = useRef("");

      // Human Coach
      const [plans, setPlans] = useState([]);
      const [subscription, setSubscription] = useState(null);
      const [plansLoading, setPlansLoading] = useState(false);
      const [paymentLoading, setPaymentLoading] = useState(false);

      const messagesEndRef = useRef(null);
      const levelRef = useRef(level);
      const sessionRef = useRef(session);
      const isTypingRef = useRef(isTyping);

      useEffect(() => { levelRef.current = level; }, [level]);
      useEffect(() => { sessionRef.current = session; }, [session]);
      useEffect(() => { isTypingRef.current = isTyping; }, [isTyping]);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setLoading(false);
          if (session) loadUserData(session);
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) loadUserData(session);
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      useEffect(() => {
        if (mainChoice === "human" && session) loadPlansAndSubscription();
      }, [mainChoice, session]);

      // Load user data including streak
      const loadUserData = async (sess) => {
        try {
          const { data: progress } = await supabase
            .from("user_progress")
            .select("*")
            .eq("user_id", sess.user.id)
            .maybeSingle();

          if (progress) {
            setCurrentStreak(progress.current_streak || 0);
            setLongestStreak(progress.longest_streak || 0);
            if (progress.level) {
              setLevel(progress.level);
              levelRef.current = progress.level;
            }
          }
        } catch (err) {
          console.error(err);
        }
      };

      // Update streak when user practices
      const updateStreak = async () => {
        if (!sessionRef.current) return;

        const today = new Date().toISOString().split("T")[0]; // YYYY-MM-DD

        const { data: progress } = await supabase
          .from("user_progress")
          .select("*")
          .eq("user_id", sessionRef.current.user.id)
          .maybeSingle();

        let newStreak = 1;
        let newLongest = longestStreak;

        if (progress && progress.last_practice_date) {
          const lastDate = progress.last_practice_date;
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          const yesterdayStr = yesterday.toISOString().split("T")[0];

          if (lastDate === today) {
            // Already practiced today
            return;
          } else if (lastDate === yesterdayStr) {
            // Consecutive day
            newStreak = (progress.current_streak || 0) + 1;
          } else {
            // Streak broken
            newStreak = 1;
          }
        }

        if (newStreak > (progress?.longest_streak || 0)) {
          newLongest = newStreak;
        } else {
          newLongest = progress?.longest_streak || newStreak;
        }

        await supabase.from("user_progress").upsert({
          user_id: sessionRef.current.user.id,
          current_streak: newStreak,
          longest_streak: newLongest,
          last_practice_date: today,
          level: levelRef.current,
          updated_at: new Date().toISOString()
        });

        setCurrentStreak(newStreak);
        setLongestStreak(newLongest);
      };

      // Speech Recognition
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = "en-US";

        recognition.onstart = () => {
          setIsListening(true);
          setMicStatus("Listening... Tap again to send");
          finalTextRef.current = "";
        };

        recognition.onresult = (event) => {
          let transcript = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          setInputText(transcript.trim());
          if (event.results[event.results.length - 1].isFinal) {
            finalTextRef.current = transcript.trim();
          }
        };

        recognition.onerror = (event) => {
          setIsListening(false);
          if (event.error === "not-allowed") setMicStatus("Microphone permission denied");
          else setMicStatus("Error: " + event.error);
        };

        recognition.onend = () => {
          setIsListening(false);
          const text = (finalTextRef.current || "").trim();
          if (text) {
            setMicStatus("Sending...");
            setTimeout(() => sendMessage(text), 200);
          } else {
            setMicStatus("No speech detected");
          }
        };

        recognitionRef.current = recognition;
      }, []);

      const toggleListening = () => {
        if (!recognitionRef.current) {
          setMicStatus("Speech recognition not supported");
          return;
        }
        if (isListening) {
          try { recognitionRef.current.stop(); } catch(e) {}
        } else {
          finalTextRef.current = "";
          setInputText("");
          try { recognitionRef.current.start(); } catch(e) {
            setMicStatus("Could not start microphone");
          }
        }
      };

      const loadPlansAndSubscription = async () => {
        setPlansLoading(true);
        try {
          const { data: plansData } = await supabase.from("plans").select("*").order("price");
          setPlans(plansData || []);
          const { data: subData } = await supabase
            .from("subscriptions")
            .select("*, plans(*)")
            .eq("user_id", session.user.id)
            .eq("status", "active")
            .gt("end_date", new Date().toISOString())
            .limit(1)
            .maybeSingle();
          setSubscription(subData);
        } catch (err) { console.error(err); }
        setPlansLoading(false);
      };

      const handleGoogleLogin = async () => {
        setAuthError("");
        setAuthLoading(true);
        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: "https://samimmandal.github.io/Fluento-app/" }
          });
          if (error) throw error;
        } catch (err) {
          setAuthError(err.message);
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setMainChoice(null);
        setLevel(null);
        setMode(null);
        setMessages([]);
        setCurrentStreak(0);
      };

      const startFreeTrial = async () => {
        if (!session) return;
        const trialPlan = plans.find(p => p.is_trial);
        if (!trialPlan) return;
        const endDate = new Date();
        endDate.setDate(endDate.getDate() + 7);
        const { error } = await supabase.from("subscriptions").insert({
          user_id: session.user.id,
          plan_id: trialPlan.id,
          status: "active",
          start_date: new Date().toISOString(),
          end_date: endDate.toISOString()
        });
        if (!error) {
          alert("🎉 7-Day Free Trial Activated!");
          loadPlansAndSubscription();
        }
      };

      const handleBuyPlan = (plan) => {
        setPaymentLoading(true);
        const options = {
          key: RAZORPAY_KEY_ID,
          amount: plan.price,
          currency: "INR",
          name: "Fluento",
          description: plan.name,
          handler: async function (response) {
            const endDate = new Date();
            endDate.setDate(endDate.getDate() + plan.duration_days);
            await supabase.from("subscriptions").insert({
              user_id: session.user.id,
              plan_id: plan.id,
              status: "active",
              start_date: new Date().toISOString(),
              end_date: endDate.toISOString(),
              razorpay_payment_id: response.razorpay_payment_id
            });
            alert("✅ Payment Successful!");
            loadPlansAndSubscription();
            setPaymentLoading(false);
          },
          prefill: { email: session.user.email },
          theme: { color: "#f43f5e" },
          modal: { ondismiss: () => setPaymentLoading(false) }
        };
        new window.Razorpay(options).open();
      };

      const handleSelectLevel = (chosenLevel) => {
        setLevel(chosenLevel);
        levelRef.current = chosenLevel;
        setShowLevelModal(false);
        setShowModeModal(true);
      };

      const handleSelectMode = (chosenMode) => {
        setMode(chosenMode);
        setShowModeModal(false);
        setMessages([{
          sender: "partner",
          text: `Hey! You're in ${chosenMode} mode at ${level} level. Let's practice!`,
          correction: null
        }]);
      };

      const parseCorrection = (rawText) => {
        if (!rawText.includes("CORRECTION:")) return { text: rawText, correction: null };
        const parts = rawText.split("CORRECTION:");
        const mainText = parts[0].trim();
        const match = parts[1].trim().match(/(.+?)\s*→\s*(.+?)(?:\s*\((.+)\))?$/);
        if (match) {
          return {
            text: mainText,
            correction: { original: match[1].trim(), corrected: match[2].trim(), tip: match[3] || "" }
          };
        }
        return { text: rawText, correction: null };
      };

      const sendMessage = async (text) => {
        const trimmed = (text || "").trim();
        if (!trimmed || isTypingRef.current || !levelRef.current || !sessionRef.current) return;

        setInputText("");
        setMicStatus("");
        finalTextRef.current = "";

        setMessages(prev => [...prev, { sender: "user", text: trimmed, correction: null }]);
        setIsTyping(true);
        isTypingRef.current = true;

        // Update streak when user practices
        updateStreak();

        try {
          const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId: sessionRef.current.user.id,
              message: trimmed,
              level: levelRef.current,
              history: messages.slice(-20).map(m => ({
                role: m.sender === "user" ? "user" : "assistant",
                content: m.text
              }))
            })
          });
          const data = await response.json();
          if (data.reply) {
            const parsed = parseCorrection(data.reply);
            setMessages(prev => [...prev, { sender: "partner", text: parsed.text, correction: parsed.correction }]);
          }
        } catch (err) {
          setMessages(prev => [...prev, { sender: "partner", text: "Connection problem. Try again.", correction: null }]);
        }
        setIsTyping(false);
        isTypingRef.current = false;
      };

      if (loading) return <div className="h-screen bg-black flex items-center justify-center text-white">Loading...</div>;

      // Login
      if (!session) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-8 w-full max-w-md text-center">
              <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white"><MicIcon /></div>
              <h1 className="text-2xl font-semibold text-white mb-1">Fluento</h1>
              <p className="text-neutral-400 text-sm mb-8">English Speaking Partner</p>
              {authError && <div className="text-red-400 text-sm mb-4">{authError}</div>}
              <button onClick={handleGoogleLogin} disabled={authLoading} className="w-full flex items-center justify-center gap-3 bg-white text-gray-800 font-medium py-3.5 rounded-xl">
                <GoogleIcon /> {authLoading ? "Redirecting..." : "Continue with Google"}
              </button>
            </div>
          </div>
        );
      }

      // Main Choice
      if (!mainChoice) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-black border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
              <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white"><MicIcon /></div>
              <h2 className="text-2xl font-semibold mb-2 text-white">Welcome to Fluento</h2>
              
              {/* Streak Badge */}
              {currentStreak > 0 && (
                <div className="inline-flex items-center gap-2 bg-orange-500/20 text-orange-400 text-sm font-medium px-4 py-1.5 rounded-full mb-6">
                  🔥 {currentStreak} Day Streak
                </div>
              )}

              <p className="text-neutral-400 text-sm mb-8">How would you like to practice?</p>
              <div className="space-y-4">
                <button onClick={() => { setMainChoice("ai"); setShowLevelModal(true); }} className="w-full py-5 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-left text-white">
                  <div className="font-medium text-lg">Practice with AI</div>
                  <div className="text-sm text-neutral-400">Speak or chat with AI</div>
                </button>
                <button onClick={() => setMainChoice("human")} className="w-full py-5 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-left text-white">
                  <div className="font-medium text-lg">Talk with Human Coach</div>
                  <div className="text-sm text-neutral-400">Real teachers • From ₹49</div>
                </button>
              </div>
              <button onClick={handleLogout} className="mt-8 text-sm text-neutral-500">Logout</button>
            </div>
          </div>
        );
      }

      // Human Coach
      if (mainChoice === "human") {
        return (
          <div className="min-h-screen bg-black text-white p-4">
            <div className="max-w-lg mx-auto">
              <div className="flex items-center justify-between mb-8">
                <button onClick={() => setMainChoice(null)} className="text-neutral-400 text-sm">← Back</button>
                <h1 className="text-xl font-semibold">Human Coach</h1>
                <div className="w-10"></div>
              </div>
              {subscription ? (
                <div className="bg-emerald-950/40 border border-emerald-800 rounded-2xl p-6 text-center">
                  <div className="text-emerald-400 font-medium">Active Plan</div>
                  <div className="text-lg font-semibold mt-1">{subscription.plans?.name}</div>
                  <button className="mt-4 w-full bg-emerald-600 py-3 rounded-xl">Book a Session (Coming Soon)</button>
                </div>
              ) : (
                <div className="space-y-4">
                  {plans.map(plan => (
                    <div key={plan.id} className="bg-neutral-900 border border-neutral-800 rounded-2xl p-5">
                      <div className="flex justify-between mb-3">
                        <div>
                          <div className="font-semibold">{plan.name}</div>
                          <div className="text-sm text-neutral-400">{plan.description}</div>
                        </div>
                        <div className="text-rose-400 font-bold">{plan.price === 0 ? "Free" : `₹${plan.price/100}`}</div>
                      </div>
                      {plan.is_trial ? (
                        <button onClick={startFreeTrial} className="w-full bg-emerald-600 py-2.5 rounded-xl text-sm">Start Free Trial</button>
                      ) : (
                        <button onClick={() => handleBuyPlan(plan)} className="w-full bg-rose-500 py-2.5 rounded-xl text-sm">Buy Now</button>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      // Level
      if (showLevelModal) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="max-w-md w-full p-8 text-center">
              <h2 className="text-2xl font-semibold text-white mb-6">Choose Your Level</h2>
              {["Beginner", "Intermediate", "Advanced"].map(l => (
                <button key={l} onClick={() => handleSelectLevel(l)} className="w-full py-4 mb-3 bg-neutral-900 border border-neutral-800 rounded-2xl text-white">{l}</button>
              ))}
              <button onClick={() => setMainChoice(null)} className="text-sm text-neutral-500 mt-4">← Back</button>
            </div>
          </div>
        );
      }

      // Mode
      if (showModeModal) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="max-w-md w-full p-8 text-center">
              <h2 className="text-2xl font-semibold text-white mb-6">Choose Mode</h2>
              <button onClick={() => handleSelectMode("voice")} className="w-full py-4 mb-3 bg-neutral-900 border border-neutral-800 rounded-2xl text-white">Voice Mode</button>
              <button onClick={() => handleSelectMode("text")} className="w-full py-4 bg-neutral-900 border border-neutral-800 rounded-2xl text-white">Text Mode</button>
            </div>
          </div>
        );
      }

      // Chat Screen
      return (
        <div className="flex h-screen bg-black text-white">
          <div className="flex-1 flex flex-col">
            <div className="h-14 border-b border-neutral-800 flex items-center justify-between px-4">
              <button onClick={() => setMainChoice(null)} className="text-sm text-neutral-400">← Home</button>
              <div className="flex items-center gap-3">
                {currentStreak > 0 && (
                  <span className="text-xs bg-orange-500/20 text-orange-400 px-2.5 py-1 rounded-full">🔥 {currentStreak}</span>
                )}
                <span className="text-sm">{level} · {mode}</span>
              </div>
              <button onClick={handleLogout} className="text-sm text-red-400">Logout</button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {messages.map((msg, idx) => (
                <div key={idx} className={`flex ${msg.sender === "user" ? "justify-end" : "justify-start"}`}>
                  <div className={`max-w-[80%] rounded-2xl px-4 py-3 text-sm ${msg.sender === "user" ? "bg-rose-500" : "bg-neutral-900 border border-neutral-800"}`}>
                    {msg.text}
                  </div>
                </div>
              ))}
              {isTyping && <div className="text-neutral-500 text-sm">Partner is typing...</div>}
              <div ref={messagesEndRef} />
            </div>

            <div className="p-4 border-t border-neutral-800">
              {mode === "voice" ? (
                <div className="flex flex-col items-center gap-3">
                  {inputText && <div className="w-full bg-neutral-900 rounded-xl px-4 py-2 text-sm text-center">{inputText}</div>}
                  <button onClick={toggleListening} className={`w-20 h-20 rounded-full flex items-center justify-center ${isListening ? "bg-rose-500 scale-110" : "bg-neutral-800"}`}>
                    <MicIcon size={32} className={isListening ? "text-white" : "text-neutral-300"} />
                  </button>
                  <p className="text-xs text-neutral-400">{micStatus || "Tap mic to speak"}</p>
                </div>
              ) : (
                <form onSubmit={(e) => { e.preventDefault(); sendMessage(inputText); }} className="flex gap-3">
                  <input value={inputText} onChange={(e) => setInputText(e.target.value)} placeholder="Type your message..." className="flex-1 bg-neutral-900 border border-neutral-700 rounded-2xl px-4 py-3 text-white" />
                  <button type="submit" className="bg-rose-500 px-5 py-3 rounded-2xl">Send</button>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
