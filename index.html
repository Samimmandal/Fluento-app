<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluento - English Speaking Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Your safe Cloudflare Worker URL
    const WORKER_URL = "https://morning-bonus-5828.imsamimmandal601.workers.dev";

    const MicIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
    );

    const RadioIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="2"/>
        <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
      </svg>
    );

    function App() {
      const [level, setLevel] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [showLevelModal, setShowLevelModal] = useState(true);
      const [activeTab, setActiveTab] = useState("chat");
      const messagesEndRef = useRef(null);

      const handleSelectLevel = (chosenLevel) => {
        setLevel(chosenLevel);
        setShowLevelModal(false);
        setMessages([{
          sender: "partner",
          text: `Hey there! I'm your English speaking practice partner. Since you're at the ${chosenLevel} level, we'll keep our chat tailored just for you. What's on your mind today?`,
          correction: null,
        }]);
      };

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      const callAI = async (userMessage, history, currentLevel) => {
        const systemPrompt = `You are a friendly, patient, and encouraging English speaking practice partner named Samim.
The user's English level is ${currentLevel}.

Rules:
- Keep responses short (under 3-4 sentences) to feel like natural spoken conversation.
- Use everyday English and contractions.
- Be warm and supportive.
- Ask one natural follow-up question.
- If the user makes a clear grammar or vocabulary mistake, gently correct it at the end using this format:
CORRECTION: [wrong] → [correct] (short tip)`;

        const apiMessages = [
          { role: "system", content: systemPrompt },
          ...history.map(m => ({
            role: m.sender === "user" ? "user" : "assistant",
            content: m.text
          })),
          { role: "user", content: userMessage }
        ];

        try {
          const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: apiMessages })
          });

          const data = await response.json();

          if (data.choices && data.choices[0]?.message?.content) {
            return data.choices[0].message.content;
          }
          return "Sorry, I didn't catch that. Could you say it again?";
        } catch (err) {
          console.error(err);
          return "I'm having trouble connecting right now. Please try again in a moment.";
        }
      };

      const handleSendMessage = async (e) => {
        if (e) e.preventDefault();
        const trimmed = inputText.trim();
        if (!trimmed || isTyping) return;

        const userMsg = trimmed;
        setInputText("");
        setMessages(prev => [...prev, { sender: "user", text: userMsg, correction: null }]);
        setIsTyping(true);

        const reply = await callAI(userMsg, messages, level);
        setIsTyping(false);
        setMessages(prev => [...prev, { sender: "partner", text: reply, correction: null }]);
      };

      return (
        <div className="flex h-screen bg-black text-white font-sans overflow-hidden select-none">
          {showLevelModal && (
            <div className="fixed inset-0 z-50 bg-black bg-opacity-80 backdrop-blur-xl flex items-center justify-center p-4">
              <div className="bg-black border border-neutral-800 rounded-3xl shadow-2xl max-w-md w-full p-8 text-center">
                <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg text-white">
                  <MicIcon />
                </div>
                <h2 className="text-2xl font-semibold tracking-tight text-white mb-2">English Partner Station</h2>
                <p className="text-neutral-400 text-sm mb-8">
                  Select your fluency level to personalize your conversation.
                </p>
                <div className="space-y-3">
                  {[
                    { title: "Beginner", subtitle: "A1-A2 · Gentle pace & simple words", level: "Beginner" },
                    { title: "Intermediate", subtitle: "B1-B2 · Natural everyday flow", level: "Intermediate" },
                    { title: "Advanced", subtitle: "C1-C2 · Idioms & nuanced speech", level: "Advanced" },
                  ].map((item) => (
                    <button
                      key={item.level}
                      onClick={() => handleSelectLevel(item.level)}
                      className="w-full py-4 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl transition flex items-center justify-between text-left group"
                    >
                      <div>
                        <div className="font-medium text-white group-hover:text-rose-400 transition">{item.title}</div>
                        <div className="text-xs text-neutral-400">{item.subtitle}</div>
                      </div>
                      <span className="text-neutral-500 group-hover:text-white">→</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Sidebar */}
          <div className="w-64 bg-black border-r border-neutral-800 hidden md:flex flex-col justify-between p-6">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-orange-400 flex items-center justify-center text-white">
                  <RadioIcon />
                </div>
                <span className="font-semibold tracking-tight text-white">Fluento</span>
              </div>
              <div className="text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-3 px-2">Discover</div>
              <div className="space-y-1">
                <button onClick={() => setActiveTab("chat")} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${activeTab === "chat" ? "bg-rose-950 text-rose-400 border border-rose-800" : "text-neutral-300 hover:bg-neutral-800"}`}>
                  Live Conversation
                </button>
                <button onClick={() => setActiveTab("discover")} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${activeTab === "discover" ? "bg-rose-950 text-rose-400 border border-rose-800" : "text-neutral-300 hover:bg-neutral-800"}`}>
                  Scenarios & Prompts
                </button>
              </div>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 flex items-center justify-between">
              <div>
                <div className="text-xs text-neutral-500">Current Level</div>
                <div className="font-medium text-sm text-rose-400">{level || "Not set"}</div>
              </div>
              <button onClick={() => setShowLevelModal(true)} className="text-xs bg-neutral-800 hover:bg-neutral-700 text-white px-2.5 py-1.5 rounded-lg">
                Switch
              </button>
            </div>
          </div>

          {/* Main Area */}
          <div className="flex-1 flex flex-col bg-black relative overflow-hidden">
            <div className="absolute top-0 left-0 right-0 h-16 bg-black border-b border-neutral-800 z-20 flex items-center justify-between px-6">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></div>
                <span className="font-medium text-sm text-white">Live Practice Session</span>
              </div>
              <span className="text-xs px-2.5 py-1 rounded-full bg-neutral-900 text-neutral-200 border border-neutral-800">
                {level} Mode
              </span>
            </div>

            {activeTab === "chat" ? (
              <div className="flex-1 overflow-y-auto pt-24 pb-32 px-4 md:px-8 space-y-6 max-w-3xl w-full mx-auto">
                {messages.map((msg, idx) => (
                  <div key={idx} className={`flex flex-col ${msg.sender === "user" ? "items-end" : "items-start"}`}>
                    <div className={`max-w-xl rounded-2xl px-4 py-3 text-sm md:text-base leading-relaxed ${msg.sender === "user" ? "bg-rose-500 text-white rounded-br-sm" : "bg-neutral-900 text-neutral-100 rounded-bl-sm border border-neutral-800"}`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
                {isTyping && (
                  <div className="flex items-center space-x-2 text-neutral-500 text-sm py-2">
                    <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce"></div>
                    <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce" style={{animationDelay: "0.2s"}}></div>
                    <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce" style={{animationDelay: "0.4s"}}></div>
                    <span className="text-xs ml-1">Partner is typing...</span>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>
            ) : (
              <div className="flex-1 overflow-y-auto pt-24 pb-32 px-6 max-w-3xl w-full mx-auto space-y-6">
                <h2 className="text-2xl font-bold text-white">Scenarios & Quick Prompts</h2>
                <div className="grid gap-3">
                  {["Job Interview Practice", "Ordering Food at a Restaurant", "Talking about Weekend Plans", "Describing your Hometown"].map((item) => (
                    <button key={item} onClick={() => { setActiveTab("chat"); setInputText(`Let's practice: ${item}`); }} className="text-left p-4 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl">
                      {item}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div className="absolute bottom-0 left-0 right-0 p-4 bg-black border-t border-neutral-800">
              <form onSubmit={handleSendMessage} className="max-w-3xl mx-auto flex gap-3">
                <input
                  type="text"
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  placeholder="Type your message..."
                  className="flex-1 bg-neutral-900 border border-neutral-700 rounded-2xl px-5 py-3 text-white placeholder-neutral-500 focus:outline-none focus:border-rose-500"
                />
                <button type="submit" className="bg-rose-500 hover:bg-rose-600 text-white px-6 py-3 rounded-2xl font-medium">
                  Send
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
