      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>

    function App() {
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authError, setAuthError] = useState("");

      const [mainChoice, setMainChoice] = useState(null);
      const [level, setLevel] = useState(null);
      const [mode, setMode] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [showLevelModal, setShowLevelModal] = useState(false);
      const [showModeModal, setShowModeModal] = useState(false);

      const [isListening, setIsListening] = useState(false);
      const [micStatus, setMicStatus] = useState("");
      const recognitionRef = useRef(null);
      const finalTextRef = useRef("");
      const isSendingRef = useRef(false);

      const [plans, setPlans] = useState([]);
      const [subscription, setSubscription] = useState(null);
      const [plansLoading, setPlansLoading] = useState(false);
      const [paymentLoading, setPaymentLoading] = useState(false);

      const messagesEndRef = useRef(null);

      // Keep latest values in refs so speech recognition can call sendMessage safely
      const levelRef = useRef(level);
      const sessionRef = useRef(session);
      const isTypingRef = useRef(isTyping);

      useEffect(() => { levelRef.current = level; }, [level]);
      useEffect(() => { sessionRef.current = session; }, [session]);
      useEffect(() => { isTypingRef.current = isTyping; }, [isTyping]);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setLoading(false);
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      useEffect(() => {
        if (mainChoice === "human" && session) loadPlansAndSubscription();
      }, [mainChoice, session]);

      // Speech Recognition
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = "en-US";

        recognition.onstart = () => {
          setIsListening(true);
          setMicStatus("Listening... Tap mic again when finished");
          finalTextRef.current = "";
          isSendingRef.current = false;
        };

        recognition.onresult = (event) => {
          let transcript = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          const clean = transcript.trim();
          setInputText(clean);
          if (event.results[event.results.length - 1].isFinal) {
            finalTextRef.current = clean;
          }
        };

        recognition.onerror = (event) => {
          setIsListening(false);
          if (event.error === "not-allowed") setMicStatus("Microphone permission denied");
          else if (event.error === "no-speech") setMicStatus("No speech detected");
          else setMicStatus("Error: " + event.error);
        };

        recognition.onend = () => {
          setIsListening(false);
          if (isSendingRef.current) return;

          const text = (finalTextRef.current || "").trim();
          if (text) {
            isSendingRef.current = true;
            setMicStatus("Sending...");
            // Small delay so UI updates
            setTimeout(() => {
              sendMessage(text);
              isSendingRef.current = false;
            }, 200);
          } else {
            setMicStatus("No speech detected. Tap mic to try again.");
          }
        };

        recognitionRef.current = recognition;
      }, []);

      const toggleListening = () => {
        if (!recognitionRef.current) {
          setMicStatus("Speech recognition not supported. Please use Chrome.");
          return;
        }
        if (isListening) {
          try { recognitionRef.current.stop(); } catch(e) {}
        } else {
          finalTextRef.current = "";
          setInputText("");
          setMicStatus("Listening...");
          try {
            recognitionRef.current.start();
          } catch (e) {
            setMicStatus("Could not start microphone");
          }
        }
      };

        setPlansLoading(true);
        try {
          const { data: plansData } = await supabase.from("plans").select("*").order("price");
          setPlans(plansData || []);
          const { data: subData } = await supabase
            .from("subscriptions")
            .select("*, plans(*)")
            .eq("user_id", session.user.id)
            .eq("status", "active")
            .gt("end_date", new Date().toISOString())
            .order("created_at", { ascending: false })
            .limit(1)
            .maybeSingle();
          setSubscription(subData);
        } catch (err) {
          console.error(err);
        }
        setPlansLoading(false);
      };

        setAuthError("");
        setAuthLoading(true);
        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: "https://samimmandal.github.io/Fluento-app/" }
          });
          if (error) throw error;
        } catch (err) {
          setAuthError(err.message);
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setMainChoice(null);
        setLevel(null);
        setMode(null);
        setMessages([]);
        setSubscription(null);
      };

      const startFreeTrial = async () => {
        if (!session) return;
        const { data: existing } = await supabase.from("subscriptions").select("id").eq("user_id", session.user.id).limit(1);
        if (existing && existing.length > 0) {
          alert("You already have a plan or trial.");
          return;
        }
        const trialPlan = plans.find(p => p.is_trial);
        if (!trialPlan) return alert("Trial plan not found");

        endDate.setDate(endDate.getDate() + trialPlan.duration_days);

          user_id: session.user.id,
          plan_id: trialPlan.id,
          status: "active",
          start_date: new Date().toISOString(),
          end_date: endDate.toISOString()
        });
        if (error) alert("Error: " + error.message);
        else {
          alert("🎉 7-Day Free Trial Activated!");
          loadPlansAndSubscription();
        }
      };

        if (!session) return;
        setPaymentLoading(true);
        const options = {
          key: RAZORPAY_KEY_ID,
          amount: plan.price,
          currency: "INR",
          name: "Fluento",

            endDate.setDate(endDate.getDate() + plan.duration_days);

              plan_id: plan.id,
              status: "active",
              start_date: new Date().toISOString(),
              end_date: endDate.toISOString(),
              razorpay_payment_id: response.razorpay_payment_id
            });

          theme: { color: "#f43f5e" },
          modal: { ondismiss: () => setPaymentLoading(false) }

          alert("Payment failed: " + response.error.description);
          setPaymentLoading(false);
        });
        rzp.open();
      };

        setLevel(chosenLevel);

        }]);

        if (!rawText.includes("CORRECTION:")) return { text: rawText, correction: null };
        const parts = rawText.split("CORRECTION:");
        const mainText = parts[0].trim();
        const correctionPart = parts[1].trim();
        const match = correctionPart.match(/(.+?)\s*→\s*(.+?)(?:\s*\((.+)\))?$/);
        if (match) {
          return {
            text: mainText,
            correction: {
              original: match[1].trim(),
              corrected: match[2].trim(),
              tip: match[3] ? match[3].trim() : ""
            }
          };
        }
        return { text: rawText, correction: null };
      };

        const trimmed = (text || "").trim();
        if (!trimmed || isTypingRef.current || !levelRef.current || !sessionRef.current) {
          setMicStatus("");
          return;
        }

            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId: sessionRef.current.user.id,
              message: trimmed,
              level: levelRef.current
            })

            setMessages(prev => [...prev, {
              sender: "partner",
              text: parsed.text,
              correction: parsed.correction
            }]);
          } else {
            setMessages(prev => [...prev, {
              sender: "partner",
              text: "Sorry, I had trouble understanding. Can you try again?",
              correction: null
            }]);
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            sender: "partner",
            text: "Connection problem. Please try again.",
            correction: null
          }]);
        }
        setIsTyping(false);
        isTypingRef.current = false;

          </div>

        if (!trialPlan) return alert("Trial plan not found");
        const endDate = new Date();
        endDate.setDate(endDate.getDate() + trialPlan.duration_days);
        const { error } = await supabase.from("subscriptions").insert({
          user_id: session.user.id,
          plan_id: trialPlan.id,
          status: "active",
          start_date: new Date().toISOString(),
          end_date: endDate.toISOString()
        });
        if (error) alert("Error: " + error.message);
        else {
          alert("🎉 7-Day Free Trial Activated!");
          loadPlansAndSubscription();
        }
      };

      const handleBuyPlan = (plan) => {
        if (!session) return;
        setPaymentLoading(true);
        const options = {
          key: RAZORPAY_KEY_ID,
          amount: plan.price,
          currency: "INR",
          name: "Fluento",
          description: plan.name + " - Human Coach",
          handler: async function (response) {
            const endDate = new Date();
            endDate.setDate(endDate.getDate() + plan.duration_days);
            const { error } = await supabase.from("subscriptions").insert({
              user_id: session.user.id,
              plan_id: plan.id,
              status: "active",
              start_date: new Date().toISOString(),
              end_date: endDate.toISOString(),
              razorpay_payment_id: response.razorpay_payment_id
            });
            if (error) alert("Payment successful but failed to activate plan.");
            else {
              alert("✅ Payment Successful! Plan activated.");
              loadPlansAndSubscription();
            }
            setPaymentLoading(false);
          },
          prefill: { email: session.user.email },
          theme: { color: "#f43f5e" },
          modal: { ondismiss: () => setPaymentLoading(false) }
        };
        const rzp = new window.Razorpay(options);
        rzp.on("payment.failed", function (response) {
          alert("Payment failed: " + response.error.description);
          setPaymentLoading(false);
        });
        rzp.open();
      };

      const handleSelectLevel = (chosenLevel) => {
        setLevel(chosenLevel);
        setShowLevelModal(false);
        setShowModeModal(true);
      };

      const handleSelectMode = (chosenMode) => {
        setMode(chosenMode);
        setShowModeModal(false);
        setMessages([{
          sender: "partner",
          text: `Hey there! I'm your English speaking practice partner. You're in ${chosenMode} mode at ${level} level. What's on your mind today?`,
          correction: null
        }]);
      };

      const parseCorrection = (rawText) => {
        if (!rawText.includes("CORRECTION:")) return { text: rawText, correction: null };
        const parts = rawText.split("CORRECTION:");
        const mainText = parts[0].trim();
        const correctionPart = parts[1].trim();
        const match = correctionPart.match(/(.+?)\s*→\s*(.+?)(?:\s*\((.+)\))?$/);
        if (match) {
          return {
            text: mainText,
            correction: {
              original: match[1].trim(),
              corrected: match[2].trim(),
              tip: match[3] ? match[3].trim() : ""
            }
          };
        }
        return { text: rawText, correction: null };
      };

      const sendMessage = async (text) => {
        const trimmed = (text || "").trim();
        if (!trimmed || isTypingRef.current || !levelRef.current || !sessionRef.current) {
          setMicStatus("");
          return;
        }

        setInputText("");
        setMicStatus("");
        finalTextRef.current = "";

        setMessages(prev => [...prev, { sender: "user", text: trimmed, correction: null }]);
        setIsTyping(true);
        isTypingRef.current = true;

        try {
          const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId: sessionRef.current.user.id,
              message: trimmed,
              level: levelRef.current
            })
          });
          const data = await response.json();
          if (data.reply) {
            const parsed = parseCorrection(data.reply);
            setMessages(prev => [...prev, {
              sender: "partner",
              text: parsed.text,
              correction: parsed.correction
            }]);
          } else {
            setMessages(prev => [...prev, {
              sender: "partner",
              text: "Sorry, I had trouble understanding. Can you try again?",
              correction: null
            }]);
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            sender: "partner",
            text: "Connection problem. Please try again.",
            correction: null
          }]);
        }
        setIsTyping(false);
        isTypingRef.current = false;
      };

      const handleSendMessage = (e) => {
        if (e) e.preventDefault();
        sendMessage(inputText);
      };

      if (loading) {
        return <div className="h-screen bg-black flex items-center justify-center text-white">Loading...</div>;
      }

      // Login
      if (!session) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-8 w-full max-w-md text-center">
              <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white">
                <MicIcon />
              </div>
              <h1 className="text-2xl font-semibold text-white mb-1">Fluento</h1>
              <p className="text-neutral-400 text-sm mb-8">English Speaking Partner</p>
              {authError && <div className="text-red-400 text-sm mb-4">{authError}</div>}
              <button onClick={handleGoogleLogin} disabled={authLoading}
                className="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-100 text-gray-800 font-medium py-3.5 rounded-xl">
                <GoogleIcon />
                {authLoading ? "Redirecting..." : "Continue with Google"}
              </button>
            </div>
          </div>
        );
      }

      // Main Choice
      if (!mainChoice) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-black border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
              <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white">
                <MicIcon />
              </div>
              <h2 className="text-2xl font-semibold mb-2 text-white">Welcome to Fluento</h2>
              <p className="text-neutral-400 text-sm mb-8">How would you like to practice English?</p>
              <div className="space-y-4">
                <button onClick={() => { setMainChoice("ai"); setShowLevelModal(true); }}
                  className="w-full py-5 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-left text-white transition">
                  <div className="font-medium text-lg">Practice with AI</div>
                  <div className="text-sm text-neutral-400">Speak or chat with AI anytime</div>
                </button>
                <button onClick={() => setMainChoice("human")}
                  className="w-full py-5 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-left text-white transition">
                  <div className="font-medium text-lg">Talk with Human Coach</div>
                  <div className="text-sm text-neutral-400">Real teachers • From ₹49</div>
                </button>
              </div>
              <button onClick={handleLogout} className="mt-8 text-sm text-neutral-500">Logout</button>
            </div>
          </div>
        );
      }

      // ==================== IMPROVED HUMAN COACH UI ====================
      if (mainChoice === "human") {
        return (
          <div className="min-h-screen bg-black text-white">
            {/* Header */}
            <div className="sticky top-0 z-10 bg-black/80 backdrop-blur border-b border-neutral-800">
              <div className="max-w-lg mx-auto px-4 py-4 flex items-center justify-between">
                <button onClick={() => setMainChoice(null)} className="text-neutral-400 hover:text-white text-sm flex items-center gap-1">
                  ← Back
                </button>
                <h1 className="text-lg font-semibold">Human Coach</h1>
                <div className="w-10"></div>
              </div>
            </div>

            <div className="max-w-lg mx-auto px-4 py-6">
              {subscription ? (
                /* Active Plan Card */
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-900/60 to-emerald-950/40 border border-emerald-700/50 p-6 mb-6">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full -translate-y-1/2 translate-x-1/2"></div>
                  <div className="relative">
                    <div className="inline-flex items-center gap-2 bg-emerald-500/20 text-emerald-400 text-xs font-medium px-3 py-1 rounded-full mb-3">
                      ● Active
                    </div>
                    <h2 className="text-2xl font-bold mb-1">{subscription.plans?.name || "Active Plan"}</h2>
                    <p className="text-neutral-400 text-sm mb-6">
                      Valid till {new Date(subscription.end_date).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}
                    </p>
                    <button className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3.5 rounded-2xl transition">
                      Book a Session
                    </button>
                  </div>
                </div>
              ) : (
                <>
                  {/* Hero */}
                  <div className="text-center mb-8">
                    <div className="w-16 h-16 bg-gradient-to-tr from-rose-500 to-orange-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                      👨‍🏫
                    </div>
                    <h2 className="text-2xl font-bold mb-2">Learn with Real Teachers</h2>
                    <p className="text-neutral-400 text-sm">Personal spoken English coaching from expert coaches</p>
                  </div>

                  {plansLoading ? (
                    <div className="text-center text-neutral-500 py-16">Loading plans...</div>
                  ) : (
                    <div className="space-y-4">
                      {plans.map((plan, index) => (
                        <div key={plan.id}
                          className={`relative rounded-2xl border p-5 transition ${
                            plan.is_trial 
                              ? "bg-gradient-to-br from-emerald-950/50 to-neutral-900 border-emerald-800/50" 
                              : "bg-neutral-900 border-neutral-800 hover:border-neutral-700"
                          }`}>
                          {plan.is_trial && (
                            <div className="absolute -top-3 left-4 bg-emerald-500 text-white text-xs font-semibold px-3 py-1 rounded-full">
                              Recommended
                            </div>
                          )}
                          <div className="flex justify-between items-start mb-4">
                            <div>
                              <h3 className="font-semibold text-lg">{plan.name}</h3>
                              <p className="text-sm text-neutral-400 mt-0.5">{plan.description}</p>
                            </div>
                            <div className="text-right">
                              <div className="text-2xl font-bold text-white">
                                {plan.price === 0 ? "Free" : `₹${plan.price / 100}`}
                              </div>
                              <div className="text-xs text-neutral-500">{plan.duration_days} days</div>
                            </div>
                          </div>
                          {plan.is_trial ? (
                            <button onClick={startFreeTrial}
                              className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3 rounded-xl transition">
                              Start 7-Day Free Trial
                            </button>
                          ) : (
                            <button onClick={() => handleBuyPlan(plan)} disabled={paymentLoading}
                              className="w-full bg-rose-500 hover:bg-rose-600 text-white font-medium py-3 rounded-xl transition disabled:opacity-50">
                              {paymentLoading ? "Processing..." : "Buy Now"}
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
        );
      }

      // Level Selection
      if (showLevelModal) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-black border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
              <h2 className="text-2xl font-semibold mb-2 text-white">Choose Your Level</h2>
              <p className="text-neutral-400 text-sm mb-8">Select your current English level</p>
              <div className="space-y-3">
                {[
                  { title: "Beginner", subtitle: "A1-A2 · Gentle pace" },
                  { title: "Intermediate", subtitle: "B1-B2 · Natural flow" },
                  { title: "Advanced", subtitle: "C1-C2 · Idioms & nuance" },
                ].map(item => (
                  <button key={item.title} onClick={() => handleSelectLevel(item.title)}
                    className="w-full py-4 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl flex justify-between items-center text-left text-white">
                    <div>
                      <div className="font-medium">{item.title}</div>
                      <div className="text-xs text-neutral-400">{item.subtitle}</div>
                    </div>
                    <span>→</span>
                  </button>
                ))}
              </div>
              <button onClick={() => setMainChoice(null)} className="mt-6 text-sm text-neutral-500">← Back</button>
            </div>
          </div>
        );
      }

      // Mode Selection
      if (showModeModal) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-black border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
              <h2 className="text-2xl font-semibold mb-2 text-white">How do you want to practice?</h2>
              <p className="text-neutral-400 text-sm mb-8">Choose your preferred way</p>
              <div className="space-y-4">
                <button onClick={() => handleSelectMode("voice")}
                  className="w-full py-5 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-left text-white">
                  <div className="font-medium text-lg">Voice Mode</div>
                  <div className="text-sm text-neutral-400">Speak with AI using microphone</div>
                </button>
                <button onClick={() => handleSelectMode("text")}
                  className="w-full py-5 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-left text-white">
                  <div className="font-medium text-lg">Text Mode</div>
                  <div className="text-sm text-neutral-400">Type messages and get replies</div>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // AI Chat / Voice Screen
      return (
        <div className="flex h-screen bg-black text-white">
          <div className="flex-1 flex flex-col">
            <div className="h-14 border-b border-neutral-800 flex items-center justify-between px-4">
              <button onClick={() => setMainChoice(null)} className="text-sm text-neutral-400">← Home</button>
              <span className="text-sm">{level} · {mode}</span>
              <button onClick={handleLogout} className="text-sm text-red-400">Logout</button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {messages.map((msg, idx) => (
                <div key={idx} className={`flex ${msg.sender === "user" ? "justify-end" : "justify-start"}`}>
                  <div className={`max-w-[80%] rounded-2xl px-4 py-3 text-sm ${
                    msg.sender === "user" ? "bg-rose-500 text-white" : "bg-neutral-900 border border-neutral-800"
                  }`}>
                    {msg.text}
                  </div>
                </div>
              ))}
              {isTyping && (
                <div className="text-neutral-500 text-sm flex items-center gap-2">
                  <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce"></div>
                  Partner is typing...
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            <div className="p-4 border-t border-neutral-800">
              {mode === "voice" ? (
                <div className="flex flex-col items-center gap-3">
                  {inputText && (
                    <div className="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-4 py-2 text-sm text-center text-neutral-200">
                      {inputText}
                    </div>
                  )}
                  <button onClick={toggleListening}
                    className={`w-20 h-20 rounded-full flex items-center justify-center transition-all duration-200 ${
                      isListening 
                        ? "bg-rose-500 scale-110 shadow-lg shadow-rose-500/50" 
                        : "bg-neutral-800 hover:bg-neutral-700"
                    }`}>
                    <MicIcon size={32} className={isListening ? "text-white" : "text-neutral-300"} />
                  </button>
                  <p className="text-xs text-neutral-400 text-center">
                    {micStatus || (isListening ? "Listening... Tap again to send" : "Tap the mic to speak")}
                  </p>
                </div>
              ) : (
                <form onSubmit={handleSendMessage} className="flex gap-3">
                  <input
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    placeholder="Type your message..."
                    className="flex-1 bg-neutral-900 border border-neutral-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-rose-500"
                  />
                  <button type="submit" className="bg-rose-500 hover:bg-rose-600 px-5 py-3 rounded-2xl font-medium">
                    Send
                  </button>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
