<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluentStream - English Speaking Partner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #1c1c1e; color: #f5f5f7; font-family: sans-serif; overflow: hidden; }
    </style>
</head>
<body class="bg-[#1c1c1e] text-[#f5f5f7]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Sparkles, MessageSquare, Radio, ChevronRight, Disc, Send } = LucideIcons;

        function App() {
          const [level, setLevel] = useState(null);
          const [messages, setMessages] = useState([]);
          const [inputText, setInputText] = useState('');
          const [isTyping, setIsTyping] = useState(false);
          const [showLevelModal, setShowLevelModal] = useState(true);
          const [activeTab, setActiveTab] = useState('chat');
          const messagesEndRef = useRef(null);

          const handleSelectLevel = (chosenLevel) => {
            setLevel(chosenLevel);
            setShowLevelModal(false);
            const initialGreeting = {
              sender: 'partner',
              text: `Hey there! I'm your English speaking practice partner. Since you're at the ${chosenLevel} level, we'll keep our chat tailored just for you. What's on your mind today? ❤️`,
              correction: null
            };
            setMessages([initialGreeting]);
          };

          const scrollToBottom = () => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          };

          useEffect(() => {
            scrollToBottom();
          }, [messages, isTyping]);

          const callGeminiAPI = async (userMessage, history, currentLevel) => {
            const apiKey = "AQ.Ab8RN6K7S3u_Untu3fjRhYWVKASpMEnu5KRacIit1BfEJaS1zA";
            const systemPrompt = `You are a friendly, patient, and encouraging English speaking practice partner. 
            The user's level is ${currentLevel}. 
            - Keep responses under 4 short sentences to mimic spoken dialogue. 
            - Use everyday expressions and contractions naturally.
            - If the user makes a grammar, vocabulary, or pronunciation mistake, include a correction block at the very end of your response using this format:
            CORRECTION_ORIGINAL: [original]
            CORRECTION_FIXED: [fixed]
            CORRECTION_TIP: [short tip]
            - Otherwise, just reply naturally and ask one engaging follow-up question.`;

            const contents = history.map(m => ({
              role: m.sender === 'user' ? 'user' : 'model',
              parts: [{ text: m.text }]
            }));
            contents.push({ role: 'user', parts: [{ text: userMessage }] });

            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: contents,
                  systemInstruction: { parts: [{ text: systemPrompt }] }
                })
              });
              const data = await response.json();
              return data.candidates?.[0]?.content?.parts?.[0]?.text || "That's interesting! Tell me more about that.";
            } catch (err) {
              return "I'm having a little trouble connecting right now, but I'm listening! What were you saying?";
            }
          };

          const handleSendMessage = async (e) => {
            e.preventDefault();
            if (!inputText.trim()) return;

            const userMsg = inputText.trim();
            setInputText('');

            const newMessages = [...messages, { sender: 'user', text: userMsg, correction: null }];
            setMessages(newMessages);
            setIsTyping(true);

            let rawReply = await callGeminiAPI(userMsg, messages, level);
            setIsTyping(false);

            let cleanReply = rawReply;
            let correction = null;

            if (rawReply.includes("CORRECTION_ORIGINAL:")) {
              const parts = rawReply.split("CORRECTION_ORIGINAL:");
              cleanReply = parts[0].trim();
              const rest = parts[1];
              const fixedSplit = rest.split("CORRECTION_FIXED:");
              const orig = fixedSplit[0].trim();
              const tipSplit = fixedSplit[1].split("CORRECTION_TIP:");
              const fixed = tipSplit[0].trim();
              const tip = tipSplit[1] ? tipSplit[1].trim() : "";
              correction = { original: orig, corrected: fixed, tip: tip };
            }

            setMessages(prev => [...prev, {
              sender: 'partner',
              text: cleanReply,
              correction: correction
            }]);
          };

          const triggerSpecialCommand = (cmdText) => {
            setInputText(cmdText);
          };

          return (
            <div className="flex h-screen bg-[#1c1c1e] text-[#f5f5f7] font-sans overflow-hidden select-none">
              {showLevelModal && (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4">
                  <div className="bg-[#2c2c2e]/90 border border-white/10 rounded-3xl shadow-2xl max-w-md w-full p-8 text-center backdrop-blur-2xl">
                    <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-rose-500/20 text-white">
                      <Disc className="w-8 h-8 animate-spin" style={{ animationDuration: '8s' }} />
                    </div>
                    <h2 className="text-2xl font-semibold tracking-tight text-white mb-2">English Partner Station</h2>
                    <p className="text-white/60 text-sm mb-8">
                      Select your fluency level to personalize your vocal rhythm and conversational style.
                    </p>
                    <div className="space-y-3">
                      {[
                        { title: 'Beginner', subtitle: 'A1-A2 · Gentle pace & simple words', level: 'Beginner' },
                        { title: 'Intermediate', subtitle: 'B1-B2 · Natural everyday flow', level: 'Intermediate' },
                        { title: 'Advanced', subtitle: 'C1-C2 · Idioms & nuanced speech', level: 'Advanced' }
                      ].map((item) => (
                        <button
                          key={item.level}
                          onClick={() => handleSelectLevel(item.level)}
                          className="w-full py-4 px-5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl transition flex items-center justify-between text-left group"
                        >
                          <div>
                            <div className="font-medium text-white group-hover:text-rose-400 transition">{item.title}</div>
                            <div className="text-xs text-white/40">{item.subtitle}</div>
                          </div>
                          <ChevronRight className="w-5 h-5 text-white/30 group-hover:text-white transition" />
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              <div className="w-64 bg-[#161618] border-r border-white/10 hidden md:flex flex-col justify-between p-6">
                <div>
                  <div className="flex items-center gap-3 mb-8">
                    <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-orange-400 flex items-center justify-center shadow-md shadow-rose-500/30">
                      <Radio className="w-5 h-5 text-white" />
                    </div>
                    <span className="font-semibold tracking-tight text-white">FluentStream</span>
                  </div>

                  <div className="text-xs font-semibold text-white/40 uppercase tracking-wider mb-3 px-2">Discover</div>
                  <div className="space-y-1">
                    <button
                      onClick={() => setActiveTab('chat')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${
                        activeTab === 'chat' ? 'bg-rose-500/15 text-rose-400 border border-rose-500/20' : 'text-white/70 hover:bg-white/5 hover:text-white'
                      }`}
                    >
                      <MessageSquare className="w-4 h-4" />
                      Live Conversation
                    </button>
                    <button
                      onClick={() => setActiveTab('discover')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${
                        activeTab === 'discover' ? 'bg-rose-500/15 text-rose-400 border border-rose-500/20' : 'text-white/70 hover:bg-white/5 hover:text-white'
                      }`}
                    >
                      <Sparkles className="w-4 h-4" />
                      Scenarios & Prompts
                    </button>
                  </div>
                </div>

                <div className="bg-white/5 border border-white/10 rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <div className="text-xs text-white/40">Current Level</div>
                    <div className="font-medium text-sm text-rose-400">{level || 'Not set'}</div>
                  </div>
                  <button
                    onClick={() => setShowLevelModal(true)}
                    className="text-xs bg-white/10 hover:bg-white/20 text-white px-2.5 py-1.5 rounded-lg transition"
                  >
                    Switch
                  </button>
                </div>
              </div>

              <div className="flex-1 flex flex-col bg-[#1c1c1e] relative overflow-hidden">
                <div className="absolute top-0 left-0 right-0 h-16 bg-[#1c1c1e]/80 backdrop-blur-xl border-b border-white/10 z-20 flex items-center justify-between px-6">
                  <div className="flex items-center gap-3">
                    <div className="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></div>
                    <span className="font-medium text-sm tracking-tight text-white">Live Practice Session</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs px-2.5 py-1 rounded-full bg-white/10 text-white/80 border border-white/5">
                      {level} Mode
                    </span>
                  </div>
                </div>

                {activeTab === 'chat' ? (
                  <div className="flex-1 overflow-y-auto pt-24 pb-32 px-4 md:px-8 space-y-6 max-w-3xl w-full mx-auto">
                    {messages.map((msg, idx) => (
                      <div
                        key={idx}
                        className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}
                      >
                        <div
                          className={`max-w-xl rounded-2xl px-4 py-3 text-sm md:text-base leading-relaxed ${
                            msg.sender === 'user'
                              ? 'bg-rose-500 text-white rounded-br-xs shadow-lg shadow-rose-500/10'
                              : 'bg-[#2c2c2e] text-white/90 rounded-bl-xs border border-white/10'
                          }`}
                        >
                          {msg.text}
                        </div>

                        {msg.correction && (
                          <div className="mt-2.5 max-w-xl w-full bg-[#2c2c2e]/80 border border-rose-500/30 rounded-2xl p-4 text-xs md:text-sm text-white/90 backdrop-blur-md shadow-lg">
                            <div className="font-semibold text-rose-400 flex items-center gap-1.5 mb-1.5">
                              <span>🔧 Gentle Correction</span>
                            </div>
                            <div className="text-white/40 line-through mb-1">"{msg.correction.original}"</div>
                            <div className="text-emerald-400 font-medium mb-2">→ "{msg.correction.corrected}"</div>
                            {msg.correction.tip && (
                              <div className="text-white/70 text-xs bg-white/5 p-2.5 rounded-xl border border-white/5 flex items-start gap-1.5">
                                <span>💡</span> <span>{msg.correction.tip}</span>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    ))}

                    {isTyping && (
                      <div className="flex items-center space-x-2 text-white/40 text-sm py-2">
                        <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce"></div>
                        <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                        <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                        <span className="text-xs ml-1">Partner is typing...</span>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>
                ) : (
                  <div className="flex-1 overflow-y-auto pt-24 pb-32 px-6 max-w-3xl w-full mx-auto space-y-6">
                    <h2 className="text-2xl font-bold text-white tracking-tight">Scenarios & Quick Prompts</h2>
                    <p className="text-white/60 text-sm">Select any immersive situation or grammar tool to boost your fluency instantly.</p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {[
                        { title: 'Ordering Coffee', desc: 'Practice ordering your morning latte and pastries.', cmd: "Let's practice ordering coffee" },
                        { title: 'Job Interview', desc: 'Answer common HR questions professionally.', cmd: "Let's practice a job interview" },
                        { title: 'Better Phrasing', desc: 'Learn how to rewrite your sentence like a native.', cmd: "Tell me a better way to say that" },
                        { title: 'Grammar Deep Dive', desc: 'Pause and ask for clear rule breakdowns.', cmd: "Explain this" }
                      ].map((card, i) => (
                        <div 
                          key={i}
                          onClick={() => { triggerSpecialCommand(card.cmd); setActiveTab('chat'); }}
                          className="bg-[#2c2c2e]/60 hover:bg-[#2c2c2e] border border-white/10 rounded-2xl p-5 cursor-pointer transition group"
                        >
                          <h3 className="font-semibold text-white group-hover:text-rose-400 transition mb-1">{card.title}</h3>
                          <p className="text-xs text-white/50 mb-4">{card.desc}</p>
                          <span className="text-xs text-rose-400 font-medium flex items-center gap-1">Start now <ChevronRight className="w-3 h-3" /></span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="absolute bottom-0 left-0 right-0 bg-[#1c1c1e]/90 backdrop-blur-xl border-t border-white/10 p-4 z-20">
                  <form onSubmit={handleSendMessage} className="max-w-3xl mx-auto flex items-center gap-3">
                    <input
                      type="text"
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      placeholder="Type your response or ask a question..."
                      className="flex-1 bg-white/5 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white/10 transition"
                    />
                    <button
                      type="submit"
                      disabled={!inputText.trim()}
                      className="bg-rose-500 hover:bg-rose-600 disabled:opacity-40 disabled:hover:bg-rose-500 text-white p-3.5 rounded-2xl transition shadow-lg shadow-rose-500/20 flex items-center justify-center"
                    >
                      <Send className="w-5 h-5" />
                    </button>
                  </form>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
