<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluento - English Speaking Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = "https://beqmmczwetvbxieentrz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KZ2ONlqKUuDe6bYxNggowQ_kc-3kBDL";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const WORKER_URL = "https://morning-bonus-5828.imsamimmandal601.workers.dev";

    const ROLE_PLAYS = [
      { id: "interview", title: "Job Interview", desc: "Practice interview questions", prompt: "You are a professional job interviewer. Ask one question at a time." },
      { id: "travel", title: "Travel & Airport", desc: "Airport, hotel, directions", prompt: "You are helping someone at an airport or hotel." },
      { id: "shopping", title: "Shopping", desc: "Buy clothes or food", prompt: "You are a friendly shopkeeper." },
      { id: "daily", title: "Daily Conversation", desc: "Casual daily English", prompt: "You are a friendly person having a casual conversation." },
      { id: "doctor", title: "Doctor Visit", desc: "Explain symptoms", prompt: "You are a doctor. Keep replies simple." },
      { id: "restaurant", title: "Restaurant", desc: "Order food", prompt: "You are a waiter in a restaurant." }
    ];

    const MicIcon = ({ size = 28, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
    );

    const ChartIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>
      </svg>
    );

    const MaskIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
    );

    const AlertIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    );

    const SunIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      </svg>
    );

    const MoonIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    );

    const MenuIcon = () => (
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    );

    const PlayIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    );

    const GoogleIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
    );

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem("fluento-theme") || "dark");
      const isDark = theme === "dark";

      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authError, setAuthError] = useState("");
      const [authLoading, setAuthLoading] = useState(false);

      const [level, setLevel] = useState(null);
      const [mode, setMode] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [micStatus, setMicStatus] = useState("");
      const [showLevelModal, setShowLevelModal] = useState(false);
      const [showModeModal, setShowModeModal] = useState(false);
      const [showRolePlay, setShowRolePlay] = useState(false);
      const [activeRolePlay, setActiveRolePlay] = useState(null);
      const [showDashboard, setShowDashboard] = useState(false);
      const [showMistakes, setShowMistakes] = useState(false);
      const [showMobileMenu, setShowMobileMenu] = useState(false);
      const [dailyGoal] = useState(10);
      const [todayMessages, setTodayMessages] = useState(0);
      const [currentStreak, setCurrentStreak] = useState(0);
      const [longestStreak, setLongestStreak] = useState(0);

      const messagesEndRef = useRef(null);
      const recognitionRef = useRef(null);
      const finalTextRef = useRef("");
      const isManualStopRef = useRef(false);
      const sessionRef = useRef(session);
      const levelRef = useRef(level);
      const modeRef = useRef(mode);
      const isTypingRef = useRef(isTyping);
      const activeRolePlayRef = useRef(null);
      const messagesRef = useRef([]);

      useEffect(() => { sessionRef.current = session; }, [session]);
      useEffect(() => { levelRef.current = level; }, [level]);
      useEffect(() => { modeRef.current = mode; }, [mode]);
      useEffect(() => { isTypingRef.current = isTyping; }, [isTyping]);
      useEffect(() => { activeRolePlayRef.current = activeRolePlay; }, [activeRolePlay]);
      useEffect(() => { messagesRef.current = messages; }, [messages]);

      useEffect(() => {
        localStorage.setItem("fluento-theme", theme);
        document.body.style.backgroundColor = isDark ? "#000" : "#f3f4f6";
      }, [theme, isDark]);

      const toggleTheme = () => setTheme(t => t === "dark" ? "light" : "dark");

      const bg = isDark ? "bg-black" : "bg-gray-100";
      const card = isDark ? "bg-neutral-900 border-neutral-800" : "bg-white border-gray-200";
      const text = isDark ? "text-white" : "text-gray-900";
      const muted = isDark ? "text-neutral-400" : "text-gray-500";
      const inputBg = isDark ? "bg-neutral-900 border-neutral-700" : "bg-white border-gray-300";
      const btnBg = isDark ? "bg-neutral-800 hover:bg-neutral-700" : "bg-gray-200 hover:bg-gray-300";

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setLoading(false);
          if (session) {
            setShowLevelModal(true);
            loadUserData(session);
          }
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, session) => {
          setSession(session);
          if (session) {
            setShowLevelModal(true);
            loadUserData(session);
          }
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      const loadUserData = async (sess) => {
        try {
          const { data } = await supabase.from("user_progress").select("*").eq("user_id", sess.user.id).maybeSingle();
          if (data) {
            setCurrentStreak(data.current_streak || 0);
            setLongestStreak(data.longest_streak || 0);
            setTodayMessages(data.today_messages || 0);
            if (data.level) {
              setLevel(data.level);
              levelRef.current = data.level;
            }
          }
        } catch (e) {}
      };

      // Speech Recognition - Manual control only
      useEffect(() => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;
        const recognition = new SR();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = "en-US";

        recognition.onstart = () => {
          setIsListening(true);
          setMicStatus("Listening... Tap mic again to send");
        };

        recognition.onresult = (e) => {
          let final = "";
          let interim = "";
          for (let i = 0; i < e.results.length; i++) {
            if (e.results[i].isFinal) {
              final += e.results[i][0].transcript + " ";
            } else {
              interim += e.results[i][0].transcript;
            }
          }
          finalTextRef.current = final.trim();
          setInputText((final + interim).trim());
        };

        recognition.onerror = (e) => {
          if (e.error !== "aborted") {
            setIsListening(false);
            if (e.error === "not-allowed") setMicStatus("Microphone permission denied");
            else setMicStatus("Error: " + e.error);
          }
        };

        recognition.onend = () => {
          setIsListening(false);
          if (isManualStopRef.current) {
            isManualStopRef.current = false;
            const text = (finalTextRef.current || inputText || "").trim();
            if (text) {
              setMicStatus("Sending...");
              setTimeout(() => sendMessage(text), 150);
            } else {
              setMicStatus("No speech detected");
            }
          }
        };

        recognitionRef.current = recognition;
      }, []);

      const toggleListening = () => {
        if (!recognitionRef.current) {
          setMicStatus("Speech not supported. Use Chrome.");
          return;
        }

        if (isListening) {
          // User tapped to stop → send
          isManualStopRef.current = true;
          try { recognitionRef.current.stop(); } catch(e) {}
        } else {
          // Start listening
          finalTextRef.current = "";
          setInputText("");
          isManualStopRef.current = false;
          setMicStatus("Listening...");
          try {
            recognitionRef.current.start();
          } catch(e) {
            setMicStatus("Could not start microphone");
          }
        }
      };

      const speakText = (text) => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.95;
        const voices = window.speechSynthesis.getVoices();
        const v = voices.find(v => v.name.toLowerCase().includes("daniel"));
        if (v) u.voice = v;
        window.speechSynthesis.speak(u);
      };

      useEffect(() => {
        if (window.speechSynthesis) {
          window.speechSynthesis.getVoices();
          window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
      }, []);

      const handleGoogleLogin = async () => {
        setAuthLoading(true);
        try {
          await supabase.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: "https://samimmandal.github.io/Fluento-app/" }
          });
        } catch (err) {
          setAuthError(err.message);
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setMessages([]);
        setLevel(null);
        setMode(null);
        setActiveRolePlay(null);
        setShowMobileMenu(false);
      };

      const startRolePlay = (role) => {
        setActiveRolePlay(role);
        setShowRolePlay(false);
        setShowMobileMenu(false);
        setMode("text");
        setMessages([{ sender: "partner", text: "Okay, let's practice " + role.title + ". I'll start.", correction: null }]);
      };

      const parseCorrection = (raw) => {
        if (!raw.includes("CORRECTION:")) return { text: raw, correction: null };
        const parts = raw.split("CORRECTION:");
        const match = parts[1].trim().match(/(.+?)\s*→\s*(.+?)(?:\s*\((.+)\))?$/);
        if (match) {
          return {
            text: parts[0].trim(),
            correction: { original: match[1].trim(), corrected: match[2].trim(), tip: match[3] || "" }
          };
        }
        return { text: raw, correction: null };
      };

      const sendMessage = async (text) => {
        const trimmed = (text || "").trim();
        if (!trimmed || isTypingRef.current || !sessionRef.current) return;

        setInputText("");
        setMicStatus("");
        finalTextRef.current = "";
        setMessages(prev => [...prev, { sender: "user", text: trimmed, correction: null }]);
        setIsTyping(true);
        isTypingRef.current = true;
        setTodayMessages(prev => prev + 1);

        const history = messagesRef.current
          .filter(m => m.text)
          .slice(-20)
          .map(m => ({
            role: m.sender === "user" ? "user" : "assistant",
            content: m.text
          }));

        try {
          const body = {
            userId: sessionRef.current.user.id,
            message: trimmed,
            level: levelRef.current || "Beginner",
            history: history
          };
          if (activeRolePlayRef.current) {
            body.rolePlay = activeRolePlayRef.current.prompt;
          }

          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (data.reply) {
            const parsed = parseCorrection(data.reply);
            setMessages(prev => [...prev, {
              sender: "partner",
              text: parsed.text,
              correction: parsed.correction,
              canPlay: true
            }]);
            // Auto speak only in voice mode
            if (modeRef.current === "voice") {
              speakText(parsed.text);
            }
          }
        } catch (e) {
          setMessages(prev => [...prev, { sender: "partner", text: "Connection problem. Try again.", correction: null }]);
        }
        setIsTyping(false);
        isTypingRef.current = false;
      };

      // ========== RENDER ==========

      if (loading) {
        return <div className={"h-screen " + bg + " flex items-center justify-center " + text}>Loading...</div>;
      }

      if (!session) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-black via-neutral-900 to-rose-950 flex items-center justify-center p-4">
            <div className="bg-neutral-900/80 border border-neutral-800 rounded-3xl p-8 w-full max-w-md text-center">
              <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white">
                <MicIcon />
              </div>
              <h1 className="text-2xl font-semibold text-white mb-1">Fluento</h1>
              <p className="text-neutral-400 text-sm mb-8">English Speaking Partner</p>
              {authError && <div className="text-red-400 text-sm mb-4">{authError}</div>}
              <button onClick={handleGoogleLogin} disabled={authLoading}
                className="w-full flex items-center justify-center gap-3 bg-white text-gray-800 font-medium py-3.5 rounded-xl">
                <GoogleIcon /> {authLoading ? "Redirecting..." : "Continue with Google"}
              </button>
            </div>
          </div>
        );
      }

      if (showLevelModal) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-black via-neutral-900 to-rose-950 flex items-center justify-center p-4">
            <div className="bg-neutral-900/80 border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
              <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white">
                <MicIcon />
              </div>
              <h2 className="text-2xl font-semibold text-white mb-2">Choose Your Level</h2>
              <p className="text-neutral-400 text-sm mb-8">Select your current English level</p>
              <div className="space-y-3">
                {["Beginner", "Intermediate", "Advanced"].map(l => (
                  <button key={l} onClick={() => { setLevel(l); setShowLevelModal(false); setShowModeModal(true); }}
                    className="w-full py-4 px-5 bg-neutral-800/80 hover:bg-neutral-700 border border-neutral-700 rounded-2xl text-left text-white">
                    {l}
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      if (showModeModal) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-black via-neutral-900 to-rose-950 flex items-center justify-center p-4">
            <div className="bg-neutral-900/80 border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
              <h2 className="text-2xl font-semibold text-white mb-6">How do you want to practice?</h2>
              <div className="space-y-4">
                <button onClick={() => {
                  setMode("voice"); setShowModeModal(false); setActiveRolePlay(null);
                  setMessages([{ sender: "partner", text: "Hey! Tap the mic and start speaking whenever you're ready.", correction: null }]);
                }} className="w-full py-5 px-5 bg-neutral-800/80 hover:bg-neutral-700 border border-neutral-700 rounded-2xl text-left text-white">
                  <div className="font-medium text-lg">Voice Mode</div>
                  <div className="text-sm text-neutral-400">Speak with AI</div>
                </button>
                <button onClick={() => {
                  setMode("text"); setShowModeModal(false); setActiveRolePlay(null);
                  setMessages([{ sender: "partner", text: "Hey! Type anything and I'll reply.", correction: null }]);
                }} className="w-full py-5 px-5 bg-neutral-800/80 hover:bg-neutral-700 border border-neutral-700 rounded-2xl text-left text-white">
                  <div className="font-medium text-lg">Text Mode</div>
                  <div className="text-sm text-neutral-400">Type messages</div>
                </button>
                <button onClick={() => { setShowModeModal(false); setShowRolePlay(true); }}
                  className="w-full py-5 px-5 bg-neutral-800/80 hover:bg-neutral-700 border border-neutral-700 rounded-2xl text-left text-white">
                  <div className="font-medium text-lg">Role Play</div>
                  <div className="text-sm text-neutral-400">Interview, Travel, Shopping...</div>
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (showRolePlay) {
        return (
          <div className={"min-h-screen " + bg + " " + text + " p-4"}>
            <div className="max-w-lg mx-auto">
              <button onClick={() => setShowRolePlay(false)} className={"mb-6 px-4 py-2 rounded-xl text-sm " + btnBg}>← Back</button>
              <h1 className="text-xl font-semibold mb-6">Role Play</h1>
              <div className="space-y-3">
                {ROLE_PLAYS.map(role => (
                  <button key={role.id} onClick={() => startRolePlay(role)}
                    className={"w-full text-left p-5 rounded-2xl border " + card}>
                    <div className="font-semibold">{role.title}</div>
                    <div className={"text-sm " + muted}>{role.desc}</div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      if (showDashboard) {
        const goalPercent = Math.min(100, Math.round((todayMessages / dailyGoal) * 100));
        return (
          <div className={"min-h-screen " + bg + " " + text + " p-4"}>
            <div className="max-w-lg mx-auto">
              <button onClick={() => setShowDashboard(false)} className={"mb-6 px-4 py-2 rounded-xl text-sm " + btnBg}>← Back</button>
              <h1 className="text-xl font-semibold mb-6">Dashboard</h1>
              <div className={card + " border rounded-2xl p-5 mb-4"}>
                <div className="flex justify-between mb-2">
                  <span>Daily Goal</span>
                  <span className="text-rose-500">{todayMessages}/{dailyGoal}</span>
                </div>
                <div className="w-full bg-gray-700 rounded-full h-3">
                  <div className="bg-rose-500 h-3 rounded-full" style={{ width: goalPercent + "%" }}></div>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div className={card + " border rounded-2xl p-5 text-center"}>
                  <div className="text-2xl font-bold">🔥 {currentStreak}</div>
                  <div className={"text-xs " + muted}>Streak</div>
                </div>
                <div className={card + " border rounded-2xl p-5 text-center"}>
                  <div className="text-2xl font-bold">{longestStreak}</div>
                  <div className={"text-xs " + muted}>Best</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (showMistakes) {
        return (
          <div className={"min-h-screen " + bg + " " + text + " p-4"}>
            <div className="max-w-lg mx-auto">
              <button onClick={() => setShowMistakes(false)} className={"mb-6 px-4 py-2 rounded-xl text-sm " + btnBg}>← Back</button>
              <h1 className="text-xl font-semibold mb-6">Mistakes</h1>
              <div className={"text-center " + muted + " py-16"}>Mistakes will appear here as you practice.</div>
            </div>
          </div>
        );
      }

      // Sidebar content (reused for desktop + mobile)
      const SidebarContent = () => (
        <>
          <div>
            <div className="flex items-center gap-3 mb-6">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-orange-400 flex items-center justify-center text-white">
                <MicIcon size={20} />
              </div>
              <span className="font-semibold">Fluento</span>
            </div>
            <div className={"text-xs " + muted + " mb-1"}>Logged in as</div>
            <div className={"text-sm truncate mb-4 " + muted}>{session.user.email}</div>

            <div className="bg-gradient-to-br from-orange-500/20 to-rose-500/10 border border-orange-500/30 rounded-2xl p-4 mb-3">
              <div className="text-xs text-orange-500">Daily Streak</div>
              <div className="text-xl font-bold">🔥 {currentStreak}</div>
            </div>

            <div className={card + " border rounded-2xl p-3 mb-3"}>
              <div className="flex justify-between text-xs mb-1">
                <span>Daily Goal</span>
                <span className="text-rose-500">{todayMessages}/{dailyGoal}</span>
              </div>
              <div className="w-full bg-gray-700 rounded-full h-2">
                <div className="bg-rose-500 h-2 rounded-full" style={{ width: Math.min(100, (todayMessages / dailyGoal) * 100) + "%" }}></div>
              </div>
            </div>
          </div>

          <div className="space-y-2">
            <button onClick={() => { setShowDashboard(true); setShowMobileMenu(false); }} className={"w-full text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 " + btnBg}>
              <ChartIcon /> Dashboard
            </button>
            <button onClick={() => { setShowRolePlay(true); setShowMobileMenu(false); }} className={"w-full text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 " + btnBg}>
              <MaskIcon /> Role Play
            </button>
            <button onClick={() => { setShowMistakes(true); setShowMobileMenu(false); }} className={"w-full text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 " + btnBg}>
              <AlertIcon /> Mistakes
            </button>
            <button onClick={() => { setShowModeModal(true); setShowMobileMenu(false); }} className={"w-full text-sm py-2.5 rounded-xl " + btnBg}>
              Switch Mode
            </button>
            <button onClick={toggleTheme} className={"w-full text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 " + btnBg}>
              {isDark ? <SunIcon /> : <MoonIcon />}
              {isDark ? "Light Mode" : "Dark Mode"}
            </button>
            <button onClick={handleLogout} className="w-full text-sm text-red-500 py-2 rounded-xl">Logout</button>
          </div>
        </>
      );

      return (
        <div className={"flex h-screen " + bg + " " + text + " overflow-hidden"}>
          {/* Desktop Sidebar */}
          <div className={"w-64 border-r " + (isDark ? "border-neutral-800" : "border-gray-200") + " hidden md:flex flex-col justify-between p-6"}>
            <SidebarContent />
          </div>

          {/* Mobile Menu Overlay */}
          {showMobileMenu && (
            <div className="fixed inset-0 z-50 md:hidden">
              <div className="absolute inset-0 bg-black/60" onClick={() => setShowMobileMenu(false)}></div>
              <div className={"absolute left-0 top-0 bottom-0 w-72 p-6 flex flex-col justify-between " + bg + " border-r " + (isDark ? "border-neutral-800" : "border-gray-200")}>
                <SidebarContent />
              </div>
            </div>
          )}

          {/* Main Chat */}
          <div className="flex-1 flex flex-col relative">
            <div className={"h-14 border-b " + (isDark ? "border-neutral-800" : "border-gray-200") + " flex items-center justify-between px-4"}>
              <div className="flex items-center gap-3">
                <button onClick={() => setShowMobileMenu(true)} className="md:hidden p-1">
                  <MenuIcon />
                </button>
                <div className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></div>
                <span className="text-sm">{activeRolePlay ? activeRolePlay.title : "Practice"}</span>
              </div>
              <div className="flex items-center gap-2">
                {currentStreak > 0 && <span className="text-xs bg-orange-500/20 text-orange-500 px-2 py-0.5 rounded-full">🔥 {currentStreak}</span>}
                <span className={"text-xs px-2 py-0.5 rounded-full border " + card}>{level} · {mode}</span>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl mx-auto w-full pb-36">
              {messages.map((msg, i) => (
                <div key={i} className={"flex flex-col " + (msg.sender === "user" ? "items-end" : "items-start")}>
                  <div className={"max-w-[85%] rounded-2xl px-4 py-3 text-sm " + (msg.sender === "user" ? "bg-rose-500 text-white" : card + " border")}>
                    {msg.text}
                  </div>
                  {/* Tap to Play button for AI messages */}
                  {msg.sender === "partner" && msg.canPlay && (
                    <button onClick={() => speakText(msg.text)}
                      className="mt-2 flex items-center gap-2 px-4 py-2 rounded-full bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium shadow-lg shadow-purple-600/30 transition">
                      <PlayIcon /> Tap to Play
                    </button>
                  )}
                </div>
              ))}
              {isTyping && <div className={muted + " text-sm"}>Partner is typing...</div>}
              <div ref={messagesEndRef} />
            </div>

            <div className={"absolute bottom-0 left-0 right-0 p-4 " + bg + " border-t " + (isDark ? "border-neutral-800" : "border-gray-200")}>
              <div className="max-w-3xl mx-auto">
                {mode === "voice" ? (
                  <div className="flex flex-col items-center gap-2">
                    {inputText && (
                      <div className={"w-full border rounded-xl px-4 py-2 text-sm text-center " + card}>{inputText}</div>
                    )}
                    <button onClick={toggleListening}
                      className={"w-16 h-16 rounded-full flex items-center justify-center transition-all " + (isListening ? "bg-rose-500 text-white scale-110 shadow-lg shadow-rose-500/40" : (isDark ? "bg-neutral-800" : "bg-gray-200"))}>
                      <MicIcon size={28} />
                    </button>
                    <p className={"text-xs " + muted}>
                      {micStatus || (isListening ? "Listening... Tap mic again to send" : "Tap mic to start speaking")}
                    </p>
                  </div>
                ) : (
                  <form onSubmit={(e) => { e.preventDefault(); sendMessage(inputText); }} className="flex gap-2">
                    <input value={inputText} onChange={(e) => setInputText(e.target.value)}
                      placeholder="Type your message..."
                      className={"flex-1 border rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500 " + inputBg + " " + text} />
                    <button type="submit" className="bg-rose-500 text-white px-5 py-3 rounded-2xl text-sm font-medium">Send</button>
                  </form>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
