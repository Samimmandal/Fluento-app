<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluento - English Speaking Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = "https://beqmmczwetvbxieentrz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KZ2ONlqKUuDe6bYxNggowQ_kc-3kBDL";
    const RAZORPAY_KEY_ID = "rzp_test_TQ1hiiz3p8aR70";
    const WORKER_URL = "https://morning-bonus-5828.imsamimmandal601.workers.dev";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MicIcon = ({ size = 28, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
    );

    const GoogleIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
    );

    function App() {
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authError, setAuthError] = useState("");
      const [authLoading, setAuthLoading] = useState(false);

      const [mainChoice, setMainChoice] = useState(null);
      const [level, setLevel] = useState(null);
      const [mode, setMode] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [showLevelModal, setShowLevelModal] = useState(false);
      const [showModeModal, setShowModeModal] = useState(false);

      // Voice
      const [isListening, setIsListening] = useState(false);
      const [micStatus, setMicStatus] = useState("");
      const recognitionRef = useRef(null);
      const finalTextRef = useRef("");

      // Human Coach
      const [plans, setPlans] = useState([]);
      const [subscription, setSubscription] = useState(null);
      const [plansLoading, setPlansLoading] = useState(false);
      const [paymentLoading, setPaymentLoading] = useState(false);

      const messagesEndRef = useRef(null);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setLoading(false);
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      useEffect(() => {
        if (mainChoice === "human" && session) loadPlansAndSubscription();
      }, [mainChoice, session]);

      // Speech Recognition
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = "en-US";

        recognition.onstart = () => {
          setIsListening(true);
          setMicStatus("Listening... Tap mic again to send");
          finalTextRef.current = "";
        };

        recognition.onresult = (event) => {
          let transcript = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          setInputText(transcript.trim());
          if (event.results[event.results.length - 1].isFinal) {
            finalTextRef.current = transcript.trim();
          }
        };

        recognition.onerror = (event) => {
          setIsListening(false);
          if (event.error === "not-allowed") setMicStatus("Microphone permission denied");
          else if (event.error === "no-speech") setMicStatus("No speech detected");
          else setMicStatus("Error: " + event.error);
        };

        recognition.onend = () => {
          setIsListening(false);
          const text = (finalTextRef.current || inputText || "").trim();
          if (text) {
            setMicStatus("Sending...");
            setTimeout(() => sendMessage(text), 300);
          } else {
            setMicStatus("No speech detected. Tap mic to try again.");
          }
        };

        recognitionRef.current = recognition;
      }, []);

      const toggleListening = () => {
        if (!recognitionRef.current) {
          setMicStatus("Speech recognition not supported. Use Chrome.");
          return;
        }
        if (isListening) {
          try { recognitionRef.current.stop(); } catch(e) {}
        } else {
          finalTextRef.current = "";
          setInputText("");
          setMicStatus("Listening...");
          try { recognitionRef.current.start(); } catch(e) {
            setMicStatus("Could not start microphone");
          }
        }
      };

      const loadPlansAndSubscription = async () => {
        setPlansLoading(true);
        try {
          const { data: plansData } = await supabase.from("plans").select("*").order("price");
          setPlans(plansData || []);
          const { data: subData } = await supabase
            .from("subscriptions")
            .select("*, plans(*)")
            .eq("user_id", session.user.id)
            .eq("status", "active")
            .gt("end_date", new Date().toISOString())
            .order("created_at", { ascending: false })
            .limit(1)
            .maybeSingle();
          setSubscription(subData);
        } catch (err) { console.error(err); }
        setPlansLoading(false);
      };

      const handleGoogleLogin = async () => {
        setAuthError("");
        setAuthLoading(true);
        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: "https://samimmandal.github.io/Fluento-app/" }
          });
          if (error) throw error;
        } catch (err) {
          setAuthError(err.message);
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setMainChoice(null);
        setLevel(null);
        setMode(null);
        setMessages([]);
        setSubscription(null);
      };

      const startFreeTrial = async () => {
        if (!session) return;
        const { data: existing } = await supabase.from("subscriptions").select("id").eq("user_id", session.user.id).limit(1);
        if (existing && existing.length > 0) {
          alert("You already have a plan or trial.");
          return;
        }
        const trialPlan = plans.find(p => p.is_trial);
        if (!trialPlan) return alert("Trial plan not found");
        const endDate = new Date();
        endDate.setDate(endDate.getDate() + trialPlan.duration_days);
        const { error } = await supabase.from("subscriptions").insert({
          user_id: session.user.id,
          plan_id: trialPlan.id,
          status: "active",
          start_date: new Date().toISOString(),
          end_date: endDate.toISOString()
        });
        if (error) alert("Error: " + error.message);
        else {
          alert("🎉 7-Day Free Trial Activated!");
          loadPlansAndSubscription();
        }
      };

      const handleBuyPlan = (plan) => {
        if (!session) return;
        setPaymentLoading(true);
        const options = {
          key: RAZORPAY_KEY_ID,
          amount: plan.price,
          currency: "INR",
          name: "Fluento",
          description: plan.name + " - Human Coach",
          handler: async function (response) {
            const endDate = new Date();
            endDate.setDate(endDate.getDate() + plan.duration_days);
            const { error } = await supabase.from("subscriptions").insert({
              user_id: session.user.id,
              plan_id: plan.id,
              status: "active",
              start_date: new Date().toISOString(),
              end_date: endDate.toISOString(),
              razorpay_payment_id: response.razorpay_payment_id
            });
            if (error) alert("Payment successful but failed to activate plan.");
            else {
              alert("✅ Payment Successful! Plan activated.");
              loadPlansAndSubscription();
            }
            setPaymentLoading(false);
          },
          prefill: { email: session.user.email },
          theme: { color: "#f43f5e" },
          modal: { ondismiss: () => setPaymentLoading(false) }
        };
        const rzp = new window.Razorpay(options);
        rzp.on("payment.failed", function (response) {
          alert("Payment failed: " + response.error.description);
          setPaymentLoading(false);
        });
        rzp.open();
      };

      const handleSelectLevel = (chosenLevel) => {
        setLevel(chosenLevel);
        setShowLevelModal(false);
        setShowModeModal(true);
      };

      const handleSelectMode = (chosenMode) => {
        setMode(chosenMode);
        setShowModeModal(false);
        setMessages([{
          sender: "partner",
          text: `Hey there! I'm your English speaking practice partner. You're in ${chosenMode} mode at ${level} level. What's on your mind today?`,
          correction: null
        }]);
      };

      const parseCorrection = (rawText) => {
        if (!rawText.includes("CORRECTION:")) return { text: rawText, correction: null };
        const parts = rawText.split("CORRECTION:");
        const mainText = parts[0].trim();
        const correctionPart = parts[1].trim();
        const match = correctionPart.match(/(.+?)\s*→\s*(.+?)(?:\s*\((.+)\))?$/);
        if (match) {
          return {
            text: mainText,
            correction: {
              original: match[1].trim(),
              corrected: match[2].trim(),
              tip: match[3] ? match[3].trim() : ""
            }
          };
        }
        return { text: rawText, correction: null };
      };

      const sendMessage = async (text) => {
        const trimmed = (text || "").trim();
        if (!trimmed || isTyping || !level || !session) return;
        setInputText("");
        setMicStatus("");
        finalTextRef.current = "";
        setMessages(prev => [...prev, { sender: "user", text: trimmed, correction: null }]);
        setIsTyping(true);
        try {
          const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: session.user.id, message: trimmed, level })
          });
          const data = await response.json();
          if (data.reply) {
            const parsed = parseCorrection(data.reply);
            setMessages(prev => [...prev, { sender: "partner", text: parsed.text, correction: parsed.correction }]);
          } else {
            setMessages(prev => [...prev, { sender: "partner", text: "Sorry, I had trouble understanding. Can you try again?", correction: null }]);
          }
        } catch (err) {
          setMessages(prev => [...prev, { sender: "partner", text: "Connection problem. Please try again.", correction: null }]);
        }
        setIsTyping(false);
      };

      const handleSendMessage = (e) => {
        if (e) e.preventDefault();
        sendMessage(inputText);
      };

      if (loading) return <div className="h-screen bg-black flex items-center justify-center text-white">Loading...</div>;

      // Login
      if (!session) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-8 w-full max-w-md text-center">
              <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white"><MicIcon /></div>
              <h1 className="text-2xl font-semibold text-white mb-1">Fluento</h1>
              <p className="text-neutral-400 text-sm mb-8">English Speaking Partner</p>
              {authError && <div className="text-red-400 text-sm mb-4">{authError}</div>}
              <button onClick={handleGoogleLogin} disabled={authLoading} className="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-100 text-gray-800 font-medium py-3.5 rounded-xl">
                <GoogleIcon /> {authLoading ? "Redirecting..." : "Continue with Google"}
              </button>
            </div>
          </div>
        );
      }

      // Main Choice
      if (!mainChoice) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-black border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
              <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white"><MicIcon /></div>
              <h2 className="text-2xl font-semibold mb-2 text-white">Welcome to Fluento</h2>
              <p className="text-neutral-400 text-sm mb-8">How would you like to practice English?</p>
              <div className="space-y-4">
                <button onClick={() => { setMainChoice("ai"); setShowLevelModal(true); }} className="w-full py-5 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-left text-white">
                  <div className="font-medium text-lg">Practice with AI</div>
                  <div className="text-sm text-neutral-400">Speak or chat with AI anytime</div>
                </button>
                <button onClick={() => setMainChoice("human")} className="w-full py-5 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-left text-white">
                  <div className="font-medium text-lg">Talk with Human Coach</div>
                  <div className="text-sm text-neutral-400">Real teachers • From ₹49</div>
                </button>
              </div>
              <button onClick={handleLogout} className="mt-8 text-sm text-neutral-500">Logout</button>
            </div>
          </div>
        );
      }

      // Human Coach
      if (mainChoice === "human") {
        return (
          <div className="min-h-screen bg-black text-white p-4">
            <div className="max-w-lg mx-auto">
              <div className="flex items-center justify-between mb-8">
                <button onClick={() => setMainChoice(null)} className="text-neutral-400 text-sm">← Back</button>
                <h1 className="text-xl font-semibold">Human Coach</h1>
                <div className="w-10"></div>
              </div>
              {subscription ? (
                <div className="bg-emerald-950/40 border border-emerald-800 rounded-2xl p-6 text-center">
                  <div className="text-emerald-400 font-medium mb-1">Active Plan</div>
                  <div className="text-lg font-semibold">{subscription.plans?.name}</div>
                  <div className="text-sm text-neutral-400 mt-1">Valid till {new Date(subscription.end_date).toLocaleDateString()}</div>
                  <button className="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-medium">Book a Session (Coming Soon)</button>
                </div>
              ) : (
                <>
                  <p className="text-neutral-400 text-sm mb-6 text-center">Get personal spoken English coaching from real teachers</p>
                  {plansLoading ? <div className="text-center text-neutral-500 py-10">Loading plans...</div> : (
                    <div className="space-y-4">
                      {plans.map(plan => (
                        <div key={plan.id} className="bg-neutral-900 border border-neutral-800 rounded-2xl p-5">
                          <div className="flex justify-between items-start mb-3">
                            <div>
                              <div className="font-semibold text-lg">{plan.name}</div>
                              <div className="text-sm text-neutral-400">{plan.description}</div>
                            </div>
                            <div className="text-right">
                              <div className="text-xl font-bold text-rose-400">{plan.price === 0 ? "Free" : `₹${plan.price / 100}`}</div>
                              <div className="text-xs text-neutral-500">{plan.duration_days} days</div>
                            </div>
                          </div>
                          {plan.is_trial ? (
                            <button onClick={startFreeTrial} className="w-full bg-emerald-600 hover:bg-emerald-700 py-2.5 rounded-xl text-sm font-medium">Start 7-Day Free Trial</button>
                          ) : (
                            <button onClick={() => handleBuyPlan(plan)} disabled={paymentLoading} className="w-full bg-rose-500 hover:bg-rose-600 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50">
                              {paymentLoading ? "Processing..." : "Buy Now"}
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
        );
      }

      // Level
      if (showLevelModal) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-black border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
              <h2 className="text-2xl font-semibold mb-6 text-white">Choose Your Level</h2>
              <div className="space-y-3">
                {["Beginner", "Intermediate", "Advanced"].map(l => (
                  <button key={l} onClick={() => handleSelectLevel(l)} className="w-full py-4 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-white text-left">{l}</button>
                ))}
              </div>
              <button onClick={() => setMainChoice(null)} className="mt-6 text-sm text-neutral-500">← Back</button>
            </div>
          </div>
        );
      }

      // Mode
      if (showModeModal) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-black border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
              <h2 className="text-2xl font-semibold mb-6 text-white">Choose Mode</h2>
              <div className="space-y-4">
                <button onClick={() => handleSelectMode("voice")} className="w-full py-4 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-white">Voice Mode</button>
                <button onClick={() => handleSelectMode("text")} className="w-full py-4 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-white">Text Mode</button>
              </div>
            </div>
          </div>
        );
      }

      // AI Chat / Voice
      return (
        <div className="flex h-screen bg-black text-white">
          <div className="flex-1 flex flex-col">
            <div className="h-14 border-b border-neutral-800 flex items-center justify-between px-4">
              <button onClick={() => setMainChoice(null)} className="text-sm text-neutral-400">← Home</button>
              <span className="text-sm">{level} · {mode}</span>
              <button onClick={handleLogout} className="text-sm text-red-400">Logout</button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {messages.map((msg, idx) => (
                <div key={idx} className={`flex ${msg.sender === "user" ? "justify-end" : "justify-start"}`}>
                  <div className={`max-w-[80%] rounded-2xl px-4 py-3 text-sm ${msg.sender === "user" ? "bg-rose-500" : "bg-neutral-900 border border-neutral-800"}`}>
                    {msg.text}
                  </div>
                </div>
              ))}
              {isTyping && <div className="text-neutral-500 text-sm">Partner is typing...</div>}
              <div ref={messagesEndRef} />
            </div>

            <div className="p-4 border-t border-neutral-800">
              {mode === "voice" ? (
                <div className="flex flex-col items-center gap-3">
                  {inputText && (
                    <div className="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-4 py-2 text-sm text-center">{inputText}</div>
                  )}
                  <button onClick={toggleListening}
                    className={`w-20 h-20 rounded-full flex items-center justify-center transition-all ${isListening ? "bg-rose-500 scale-110 shadow-lg shadow-rose-500/50" : "bg-neutral-800 hover:bg-neutral-700"}`}>
                    <MicIcon size={32} className={isListening ? "text-white" : "text-neutral-300"} />
                  </button>
                  <p className="text-xs text-neutral-400">{micStatus || (isListening ? "Listening... Tap again to send" : "Tap the mic to speak")}</p>
                </div>
              ) : (
                <form onSubmit={handleSendMessage} className="flex gap-3">
                  <input value={inputText} onChange={(e) => setInputText(e.target.value)} placeholder="Type your message..."
                    className="flex-1 bg-neutral-900 border border-neutral-700 rounded-2xl px-4 py-3 text-white focus:outline-none" />
                  <button type="submit" className="bg-rose-500 px-5 py-3 rounded-2xl">Send</button>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
