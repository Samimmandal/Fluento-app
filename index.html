<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluento - English Speaking Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const WORKER_URL = "https://morning-bonus-5828.imsamimmandal601.workers.dev";

    // Generate or get user ID (this creates memory for each person)
    function getUserId() {
      let id = localStorage.getItem("fluento_user_id");
      if (!id) {
        id = "user_" + Math.random().toString(36).substring(2, 15) + Date.now();
        localStorage.setItem("fluento_user_id", id);
      }
      return id;
    }

    const MicIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
    );

    const RadioIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="2"/>
        <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
      </svg>
    );

    function App() {
      const [level, setLevel] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [showLevelModal, setShowLevelModal] = useState(true);
      const [activeTab, setActiveTab] = useState("chat");
      const messagesEndRef = useRef(null);
      const userId = getUserId();

      const handleSelectLevel = (chosenLevel) => {
        setLevel(chosenLevel);
        setShowLevelModal(false);

        // First message when starting
        setMessages([{
          sender: "partner",
          text: `Hey there! I'm your English speaking practice partner. Since you're at the ${chosenLevel} level, we'll keep our chat tailored just for you. What's on your mind today?`,
          correction: null
        }]);
      };

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      // Parse correction
      const parseCorrection = (rawText) => {
        if (!rawText.includes("CORRECTION:")) {
          return { text: rawText, correction: null };
        }

        const parts = rawText.split("CORRECTION:");
        const mainText = parts[0].trim();
        const correctionPart = parts[1].trim();

        const match = correctionPart.match(/(.+?)\s*→\s*(.+?)(?:\s*\((.+)\))?$/);

        if (match) {
          return {
            text: mainText,
            correction: {
              original: match[1].trim(),
              corrected: match[2].trim(),
              tip: match[3] ? match[3].trim() : ""
            }
          };
        }
        return { text: rawText, correction: null };
      };

      const handleSendMessage = async (e) => {
        if (e) e.preventDefault();
        const trimmed = inputText.trim();
        if (!trimmed || isTyping || !level) return;

        const userMsg = trimmed;
        setInputText("");
        setMessages(prev => [...prev, { sender: "user", text: userMsg, correction: null }]);
        setIsTyping(true);

        try {
          const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId: userId,
              message: userMsg,
              level: level
            })
          });

          const data = await response.json();

          if (data.reply) {
            const parsed = parseCorrection(data.reply);
            setMessages(prev => [...prev, {
              sender: "partner",
              text: parsed.text,
              correction: parsed.correction
            }]);
          } else {
            setMessages(prev => [...prev, {
              sender: "partner",
              text: "Sorry, I had trouble understanding. Can you try again?",
              correction: null
            }]);
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            sender: "partner",
            text: "Connection problem. Please try again in a moment.",
            correction: null
          }]);
        }

        setIsTyping(false);
      };

      return (
        <div className="flex h-screen bg-black text-white font-sans overflow-hidden">
          {showLevelModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4">
              <div className="bg-black border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
                <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white">
                  <MicIcon />
                </div>
                <h2 className="text-2xl font-semibold mb-2">English Partner Station</h2>
                <p className="text-neutral-400 text-sm mb-8">Select your fluency level</p>
                <div className="space-y-3">
                  {[
                    { title: "Beginner", subtitle: "A1-A2 · Gentle pace", level: "Beginner" },
                    { title: "Intermediate", subtitle: "B1-B2 · Natural flow", level: "Intermediate" },
                    { title: "Advanced", subtitle: "C1-C2 · Idioms & nuance", level: "Advanced" },
                  ].map(item => (
                    <button key={item.level} onClick={() => handleSelectLevel(item.level)}
                      className="w-full py-4 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl flex justify-between items-center text-left">
                      <div>
                        <div className="font-medium">{item.title}</div>
                        <div className="text-xs text-neutral-400">{item.subtitle}</div>
                      </div>
                      <span>→</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Sidebar */}
          <div className="w-64 border-r border-neutral-800 hidden md:flex flex-col justify-between p-6">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-orange-400 flex items-center justify-center">
                  <RadioIcon />
                </div>
                <span className="font-semibold">Fluento</span>
              </div>
              <button onClick={() => setActiveTab("chat")} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm mb-1 ${activeTab === "chat" ? "bg-rose-950 text-rose-400" : "text-neutral-300"}`}>
                Live Conversation
              </button>
              <button onClick={() => setActiveTab("discover")} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm ${activeTab === "discover" ? "bg-rose-950 text-rose-400" : "text-neutral-300"}`}>
                Scenarios & Prompts
              </button>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 flex justify-between items-center">
              <div>
                <div className="text-xs text-neutral-500">Current Level</div>
                <div className="text-sm text-rose-400">{level || "—"}</div>
              </div>
              <button onClick={() => setShowLevelModal(true)} className="text-xs bg-neutral-800 px-2 py-1 rounded-lg">Switch</button>
            </div>
          </div>

          {/* Chat Area */}
          <div className="flex-1 flex flex-col relative">
            <div className="h-16 border-b border-neutral-800 flex items-center justify-between px-6">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></div>
                <span className="text-sm">Live Practice Session</span>
              </div>
              <span className="text-xs px-3 py-1 rounded-full bg-neutral-900 border border-neutral-800">{level} Mode</span>
            </div>

            <div className="flex-1 overflow-y-auto pt-6 pb-32 px-4 md:px-8 space-y-6 max-w-3xl mx-auto w-full">
              {messages.map((msg, idx) => (
                <div key={idx} className={`flex flex-col ${msg.sender === "user" ? "items-end" : "items-start"}`}>
                  <div className={`max-w-xl rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                    msg.sender === "user" 
                      ? "bg-rose-500 text-white rounded-br-sm" 
                      : "bg-neutral-900 border border-neutral-800 rounded-bl-sm"
                  }`}>
                    {msg.text}
                  </div>

                  {msg.correction && (
                    <div className="mt-3 max-w-xl w-full bg-neutral-900 border border-rose-900/40 rounded-2xl p-4 text-sm">
                      <div className="font-semibold text-rose-400 flex items-center gap-2 mb-2">
                        🔧 Gentle Correction
                      </div>
                      <div className="text-neutral-500 line-through mb-1">"{msg.correction.original}"</div>
                      <div className="text-emerald-400 font-medium mb-2">→ "{msg.correction.corrected}"</div>
                      {msg.correction.tip && (
                        <div className="text-neutral-300 text-xs bg-black/40 p-2.5 rounded-xl border border-neutral-800 flex gap-2">
                          <span>💡</span>
                          <span>{msg.correction.tip}</span>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ))}

              {isTyping && (
                <div className="flex items-center gap-2 text-neutral-500 text-sm">
                  <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce"></div>
                  <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce" style={{animationDelay:"0.2s"}}></div>
                  <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce" style={{animationDelay:"0.4s"}}></div>
                  <span className="text-xs">Partner is typing...</span>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            <div className="absolute bottom-0 left-0 right-0 p-4 bg-black border-t border-neutral-800">
              <form onSubmit={handleSendMessage} className="max-w-3xl mx-auto flex gap-3">
                <input
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  placeholder="Type your message..."
                  className="flex-1 bg-neutral-900 border border-neutral-700 rounded-2xl px-5 py-3 text-white focus:outline-none focus:border-rose-500"
                />
                <button type="submit" className="bg-rose-500 hover:bg-rose-600 text-white px-6 py-3 rounded-2xl font-medium">
                  Send
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
