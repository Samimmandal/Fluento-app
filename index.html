<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluento - English Speaking Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ========== YOUR SUPABASE KEYS ==========
    const SUPABASE_URL = "https://beqmmczwetvbxieentrz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KZ2ONlqKUuDe6bYxNggowQ_kc-3kBDL";
    // ========================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const WORKER_URL = "https://morning-bonus-5828.imsamimmandal601.workers.dev";

    const MicIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
    );

    function App() {
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authMode, setAuthMode] = useState("login"); // login or signup
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [authError, setAuthError] = useState("");
      const [authLoading, setAuthLoading] = useState(false);

      // Chat states
      const [level, setLevel] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [showLevelModal, setShowLevelModal] = useState(true);
      const messagesEndRef = useRef(null);

      // Check if user is already logged in
      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
        });

        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      // ========== AUTH FUNCTIONS ==========
      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthLoading(true);

        try {
          if (authMode === "login") {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
          } else {
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            alert("Account created! Please check your email to confirm (or just try logging in).");
            setAuthMode("login");
          }
        } catch (err) {
          setAuthError(err.message);
        }
        setAuthLoading(false);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setMessages([]);
        setLevel(null);
        setShowLevelModal(true);
      };

      // ========== CHAT FUNCTIONS ==========
      const handleSelectLevel = (chosenLevel) => {
        setLevel(chosenLevel);
        setShowLevelModal(false);
        setMessages([{
          sender: "partner",
          text: `Hey there! I'm your English speaking practice partner. Since you're at the ${chosenLevel} level, we'll keep our chat tailored just for you. What's on your mind today?`,
          correction: null
        }]);
      };

      const parseCorrection = (rawText) => {
        if (!rawText.includes("CORRECTION:")) {
          return { text: rawText, correction: null };
        }
        const parts = rawText.split("CORRECTION:");
        const mainText = parts[0].trim();
        const correctionPart = parts[1].trim();
        const match = correctionPart.match(/(.+?)\s*→\s*(.+?)(?:\s*\((.+)\))?$/);
        if (match) {
          return {
            text: mainText,
            correction: {
              original: match[1].trim(),
              corrected: match[2].trim(),
              tip: match[3] ? match[3].trim() : ""
            }
          };
        }
        return { text: rawText, correction: null };
      };

      const handleSendMessage = async (e) => {
        if (e) e.preventDefault();
        const trimmed = inputText.trim();
        if (!trimmed || isTyping || !level || !session) return;

        const userMsg = trimmed;
        setInputText("");
        setMessages(prev => [...prev, { sender: "user", text: userMsg, correction: null }]);
        setIsTyping(true);

        try {
          const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId: session.user.id,   // Real Supabase user ID
              message: userMsg,
              level: level
            })
          });

          const data = await response.json();

          if (data.reply) {
            const parsed = parseCorrection(data.reply);
            setMessages(prev => [...prev, {
              sender: "partner",
              text: parsed.text,
              correction: parsed.correction
            }]);
          } else {
            setMessages(prev => [...prev, {
              sender: "partner",
              text: "Sorry, I had trouble understanding. Can you try again?",
              correction: null
            }]);
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            sender: "partner",
            text: "Connection problem. Please try again.",
            correction: null
          }]);
        }
        setIsTyping(false);
      };

      // ========== LOADING SCREEN ==========
      if (loading) {
        return (
          <div className="h-screen bg-black flex items-center justify-center text-white">
            Loading...
          </div>
        );
      }

      // ========== LOGIN / SIGNUP SCREEN ==========
      if (!session) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-8 w-full max-w-md">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white">
                  <MicIcon />
                </div>
                <h1 className="text-2xl font-semibold text-white">Fluento</h1>
                <p className="text-neutral-400 text-sm mt-1">English Speaking Partner</p>
              </div>

              <div className="flex mb-6 bg-neutral-800 rounded-xl p-1">
                <button
                  onClick={() => { setAuthMode("login"); setAuthError(""); }}
                  className={`flex-1 py-2 rounded-lg text-sm font-medium transition ${authMode === "login" ? "bg-rose-500 text-white" : "text-neutral-400"}`}
                >
                  Login
                </button>
                <button
                  onClick={() => { setAuthMode("signup"); setAuthError(""); }}
                  className={`flex-1 py-2 rounded-lg text-sm font-medium transition ${authMode === "signup" ? "bg-rose-500 text-white" : "text-neutral-400"}`}
                >
                  Sign Up
                </button>
              </div>

              <form onSubmit={handleAuth} className="space-y-4">
                <div>
                  <label className="block text-sm text-neutral-400 mb-1">Email</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required
                    className="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500"
                    placeholder="you@example.com"
                  />
                </div>
                <div>
                  <label className="block text-sm text-neutral-400 mb-1">Password</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    required
                    minLength={6}
                    className="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500"
                    placeholder="••••••••"
                  />
                </div>

                {authError && (
                  <div className="text-red-400 text-sm bg-red-950/30 border border-red-900 rounded-xl p-3">
                    {authError}
                  </div>
                )}

                <button
                  type="submit"
                  disabled={authLoading}
                  className="w-full bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-xl font-medium transition disabled:opacity-50"
                >
                  {authLoading ? "Please wait..." : (authMode === "login" ? "Login" : "Create Account")}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ========== MAIN CHAT SCREEN ==========
      return (
        <div className="flex h-screen bg-black text-white font-sans overflow-hidden">
          {showLevelModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4">
              <div className="bg-black border border-neutral-800 rounded-3xl max-w-md w-full p-8 text-center">
                <div className="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 text-white">
                  <MicIcon />
                </div>
                <h2 className="text-2xl font-semibold mb-2">Choose Your Level</h2>
                <p className="text-neutral-400 text-sm mb-8">Select your current English level</p>
                <div className="space-y-3">
                  {[
                    { title: "Beginner", subtitle: "A1-A2 · Gentle pace", level: "Beginner" },
                    { title: "Intermediate", subtitle: "B1-B2 · Natural flow", level: "Intermediate" },
                    { title: "Advanced", subtitle: "C1-C2 · Idioms & nuance", level: "Advanced" },
                  ].map(item => (
                    <button key={item.level} onClick={() => handleSelectLevel(item.level)}
                      className="w-full py-4 px-5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl flex justify-between items-center text-left">
                      <div>
                        <div className="font-medium">{item.title}</div>
                        <div className="text-xs text-neutral-400">{item.subtitle}</div>
                      </div>
                      <span>→</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Sidebar */}
          <div className="w-64 border-r border-neutral-800 hidden md:flex flex-col justify-between p-6">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-orange-400 flex items-center justify-center">
                  <MicIcon />
                </div>
                <span className="font-semibold">Fluento</span>
              </div>
              <div className="text-xs text-neutral-500 mb-4">Logged in as</div>
              <div className="text-sm text-neutral-300 truncate mb-6">{session.user.email}</div>
            </div>
            <div className="space-y-3">
              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4">
                <div className="text-xs text-neutral-500">Current Level</div>
                <div className="text-sm text-rose-400">{level || "—"}</div>
              </div>
              <button onClick={() => setShowLevelModal(true)} className="w-full text-sm bg-neutral-800 hover:bg-neutral-700 py-2 rounded-xl">
                Switch Level
              </button>
              <button onClick={handleLogout} className="w-full text-sm text-red-400 hover:bg-red-950/30 py-2 rounded-xl">
                Logout
              </button>
            </div>
          </div>

          {/* Chat Area */}
          <div className="flex-1 flex flex-col relative">
            <div className="h-16 border-b border-neutral-800 flex items-center justify-between px-6">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></div>
                <span className="text-sm">Live Practice Session</span>
              </div>
              <span className="text-xs px-3 py-1 rounded-full bg-neutral-900 border border-neutral-800">{level} Mode</span>
            </div>

            <div className="flex-1 overflow-y-auto pt-6 pb-32 px-4 md:px-8 space-y-6 max-w-3xl mx-auto w-full">
              {messages.map((msg, idx) => (
                <div key={idx} className={`flex flex-col ${msg.sender === "user" ? "items-end" : "items-start"}`}>
                  <div className={`max-w-xl rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                    msg.sender === "user" 
                      ? "bg-rose-500 text-white rounded-br-sm" 
                      : "bg-neutral-900 border border-neutral-800 rounded-bl-sm"
                  }`}>
                    {msg.text}
                  </div>

                  {msg.correction && (
                    <div className="mt-3 max-w-xl w-full bg-neutral-900 border border-rose-900/40 rounded-2xl p-4 text-sm">
                      <div className="font-semibold text-rose-400 flex items-center gap-2 mb-2">
                        🔧 Gentle Correction
                      </div>
                      <div className="text-neutral-500 line-through mb-1">"{msg.correction.original}"</div>
                      <div className="text-emerald-400 font-medium mb-2">→ "{msg.correction.corrected}"</div>
                      {msg.correction.tip && (
                        <div className="text-neutral-300 text-xs bg-black/40 p-2.5 rounded-xl border border-neutral-800 flex gap-2">
                          <span>💡</span>
                          <span>{msg.correction.tip}</span>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ))}

              {isTyping && (
                <div className="flex items-center gap-2 text-neutral-500 text-sm">
                  <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce"></div>
                  <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce" style={{animationDelay:"0.2s"}}></div>
                  <div className="w-2 h-2 bg-rose-500 rounded-full animate-bounce" style={{animationDelay:"0.4s"}}></div>
                  <span className="text-xs">Partner is typing...</span>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            <div className="absolute bottom-0 left-0 right-0 p-4 bg-black border-t border-neutral-800">
              <form onSubmit={handleSendMessage} className="max-w-3xl mx-auto flex gap-3">
                <input
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  placeholder="Type your message..."
                  className="flex-1 bg-neutral-900 border border-neutral-700 rounded-2xl px-5 py-3 text-white focus:outline-none focus:border-rose-500"
                />
                <button type="submit" className="bg-rose-500 hover:bg-rose-600 text-white px-6 py-3 rounded-2xl font-medium">
                  Send
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
